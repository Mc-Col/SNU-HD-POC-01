# 정규화 · 변환 규칙표
#
# 소유: 서경빈 선임 (표기 매핑) / 이종수 책임 (도메인 규칙)
# 코드에 규칙을 넣지 말고 이 파일에 추가한다.

meta:
  version: "0.1.0"
  note: "MVP — 단위 변환과 범주형 허용값은 범위 외(To-be)"

# ── 도메인 규칙 ────────────────────────────────────────────────
# 문서 표기가 표준값과 다른 의미를 갖는 경우. 역전 매핑 주의.
domain_rules:
  actuator_fail_action:
    description: "데이터시트는 공기 작용 방향(ATO/ATC)으로 기재하고, 표준값은 공기 상실 시 거동(Fail)이다. 서로 반대다."
    map:
      - from: ["AIR TO OPEN", "AIR-TO-OPEN", "ATO", "A/O"]
        to: "FAIL CLOSE"
        trace: "ATO → 공기 상실 시 스프링 폐쇄 → Fail Close"
      - from: ["AIR TO CLOSE", "AIR-TO-CLOSE", "ATC", "A/C"]
        to: "FAIL OPEN"
        trace: "ATC → 공기 상실 시 스프링 개방 → Fail Open"
      - from: ["FAIL LAST", "FAIL IN PLACE", "FAIL LOCK"]
        to: "FAIL LAST"
        trace: "직접 기재"
    # ── 직접 기재 표기 (2026-08-24) ────────────────────────────
    # 위 map 은 값 자체가 ATO/ATC 인 경우다. 그런데 대부분의 양식은
    # 라벨이 이미 "공기 상실 시" 를 뜻하고 값에는 방향만 적는다.
    #   "Air Fails Valve to : Close"  → FAIL CLOSE   (라벨이 직접 기재)
    #   "Air to Actuator   : Open"    → FAIL CLOSE   (라벨이 역전. 값과 반대)
    # 값만 보면 둘 다 그냥 Close/Open 이라 구분이 불가능하다. **라벨을 봐야 한다.**
    #
    # 골든셋 11건의 원문라벨은 전부 직접 기재였다 —
    #   Air Fails Valve to · Fail Position · Failure Mode · Actuator Fail
    direct_labels:
      - "AIR FAILS VALVE TO"
      - "FAIL POSITION"
      - "FAIL ACTION"
      - "FAILURE MODE"
      - "ACTUATOR FAIL"
      - "ACTUATOR FAILURE MODE"
      - "FAIL SAFE POSITION"
      - "FAIL SAFE"
    direct_map:
      # `VALVE OPEN` · `VALVE CLOSE` 는 2026-08-24 평가에서 관측 (d007 · d010)
      - from: ["OPEN", "TO OPEN", "OPENS", "FO", "F.O.", "개방",
               "VALVE OPEN", "VALVE OPENS", "V/V OPEN", "OPEN POSITION",
               "FAIL OPEN", "FAIL-OPEN", "FAIL TO OPEN"]
        to: "FAIL OPEN"
        trace: "라벨이 직접 기재 — 공기 상실 시 개방"
      - from: ["CLOSE", "CLOSED", "TO CLOSE", "CLOSES", "FC", "F.C.", "폐쇄",
               "VALVE CLOSE", "VALVE CLOSED", "V/V CLOSE", "CLOSE POSITION",
               "FAIL CLOSE", "FAIL-CLOSE", "FAIL TO CLOSE"]
        to: "FAIL CLOSE"
        trace: "라벨이 직접 기재 — 공기 상실 시 폐쇄"
      - from: ["LOCK", "LAST", "IN PLACE", "LOCKED", "정지"]
        to: "FAIL LAST"
        trace: "라벨이 직접 기재 — 공기 상실 시 현 위치 유지"
    # 라벨이 이 목록에 없고 값도 ATO/ATC 가 아니면 **변환하지 않는다.**
    # 역전 여부를 모르는 상태에서 방향을 정하면 안전 사양을 뒤집을 수 있다.
    cross_check: []
    # 2026-08-23 결정 — ACTUATOR TYPE 은 추출 대상이 아니다(구동부는 FAIL POSITION 만).
    # 따라서 자동 교차검증이 불가하고, 사람 확인이 유일한 안전장치다.
    # 지침은 schema/guidance.yaml : fields.actuator_fail_action 에 자연어로 있다.
    cross_check_note: "ACTUATOR TYPE 추출 대상 외 → 자동 교차검증 불가"

# ── 표기 매핑 ──────────────────────────────────────────────────
# 같은 값의 다른 표기. **평가 실행에서 실제로 나온 것만 넣는다.**
# 상상해서 늘리면 문서에 없는 값을 맞다고 판정하게 된다.
#
# 2026-08-24 첫 VLM 실행(68%)의 오답 30건 중 13건이 "값은 맞고 표기만 다름"
# 이었다. 아래는 그때 관측된 표기다. 출처를 seen 에 남긴다.
value_aliases:

  # 등급 — 단일 필드 최대 실패(7건). ANSI/ASME/CL 접두어가 붙거나 안 붙는다.
  valve_body_rating:
    - from: ["ANSI CLASS 150", "ASME CLASS 150", "ASME CL.150", "CL 150",
             "CLASS 150", "ANSI 150", "ASME 150#", "150 LB", "150LB"]
      to: "150#"
    - from: ["ANSI CLASS 300", "ASME CLASS 300", "ASME CL.300", "CL 300",
             "CLASS 300", "ANSI 300", "ASME 300#", "300 LB", "300LB"]
      to: "300#"
      seen: "d005 · d006 ANSI CLASS 300 / d010 ASME 300# / d011 ASME CLASS 300"
    - from: ["ANSI CLASS 600", "ASME CLASS 600", "ASME CL.600", "CL 600",
             "CLASS 600", "ANSI 600", "ASME 600#", "600 LB", "600LB"]
      to: "600#"
      seen: "d004 ANSI CLASS 600 / d007 ASME CL.600"
    - from: ["ANSI CLASS 900", "ASME CL.900", "CL 900", "CLASS 900"]
      to: "900#"
    - from: ["ANSI CLASS 1500", "ASME CLASS 1500", "ASME CL.1500", "CL 1500",
             "CLASS 1500", "ANSI 1500"]
      to: "1500#"
      seen: "d008 CL 1500"
    - from: ["ANSI CLASS 2500", "ASME CL.2500", "CL 2500", "CLASS 2500"]
      to: "2500#"

  # 제조사 — 법인명 접미(Controls · Co.,Ltd. · Inc.)가 붙는다. 짧은 형으로 통일.
  manufacturer:
    - from: ["FISHER CONTROLS", "FISHER CONTROLS INTERNATIONAL",
             "NIPPON FISHER", "NIPPON FISHER CO.,LTD.", "FISHER CO.,LTD."]
      to: "FISHER"
      seen: "d001 Fisher Controls"
    - from: ["METSO AUTOMATION", "METSO KOREA", "METSO KOREA CO., LTD.",
             "METSO FLOW CONTROL"]
      to: "METSO"
    - from: ["VALSTONE CONTROLS, INC.", "VALSTONE CONTROLS",
             "VALSTONE SERVICE, CO.", "VALSTONE SERVICE CO."]
      to: "VALSTONE"
      seen: "d011 VALSTONE CONTROLS, INC."
    - from: ["UNICON SYSTEM CO.,LTD.", "UNICON SYSTEM", "UNICON SYSTEM CO."]
      to: "UNICON"
      seen: "d007 UNICON SYSTEM CO.,LTD."
    - from: ["FLOWSERVE CORPORATION", "FLOWSERVE KOREA"]
      to: "FLOWSERVE"
    - from: ["NIIGATA MASONEILAN", "MASONEILAN DRESSER", "DRESSER MASONEILAN"]
      to: "MASONEILAN"
      seen: "d006 NIIGATA MASONEILAN — 단 이 건의 정답은 FISHER 였다(별칭이 아니라 오독)"
    - from: ["AZBIL CORPORATION", "YAMATAKE", "YAMATAKE-HONEYWELL"]
      to: "AZBIL"

  # 누설등급 — 로마자·아라비아가 섞인다. **표준값은 아라비아**다
  # (2026-08-25 결정: 조회하는 사람이 숫자 4를 먼저 떠올린다).
  # 표준(ANSI/FCI 70-2)의 표기법은 로마자이지만, 그것은 문서의 표기법이고
  # DB 열의 표기법은 쓰는 사람 기준으로 정한다. 원문은 감사 시트에 남는다.
  valve_leakage_class:
    - from: ["ANSI CLASS II", "ANSI CLASS 2", "CLASS II", "CLASS 2", "ANSI II"]
      to: "CLASS 2"
    - from: ["ANSI CLASS III", "ANSI CLASS 3", "CLASS III", "CLASS 3"]
      to: "CLASS 3"
    - from: ["ANSI CLASS IV", "ANSI CLASS 4", "CLASS IV", "CLASS 4", "ANSI IV"]
      to: "CLASS 4"
      seen: "d004 · d006 CLASS 4 / d005 · d007 CLASS IV / d008 Class IV"
    - from: ["ANSI CLASS V", "ANSI CLASS 5", "CLASS V", "CLASS 5"]
      to: "CLASS 5"
    - from: ["ANSI CLASS VI", "ANSI CLASS 6", "CLASS VI", "CLASS 6"]
      to: "CLASS 6"

  # 유량 특성
  characteristic:
    - from: ["EQ%", "EQ %", "EQUAL PERCENT", "EQUAL %", "EQUAL PERCENTAGE",
             "%EQ", "EQUAL-PERCENT"]
      to: "EQUAL PERCENTAGE"
      seen: "d001~d003 Equal Percent / d005 · d010 · d011 EQ%"
    - from: ["MODIFIED PERCENTAGE", "MODIFIED EQUAL PERCENT", "MOD. EQ%",
             "MODIFIED %"]
      to: "MODIFIED PERCENTAGE"
      seen: "d004"
    - from: ["LINEAR", "LIN."]
      to: "LINEAR"
    - from: ["QUICK OPENING", "Q.O.", "QO"]
      to: "QUICK OPENING"

  # 본체 크기 — 규격 접미(25A·NPS·DN)가 붙는다. 2026-08-24 평가에서 관측.
  # 값 자체는 인치 표기로 통일한다 — 마스터DB 에 25A 와 1" 가 섞이면 안 된다.
  valve_body_size:
    - from: ["1/2\"", "1/2 IN", "NPS 1/2", "DN15", "15A", "1/2\" (15A)"]
      to: "1/2\""
    - from: ["3/4\"", "3/4 IN", "NPS 3/4", "DN20", "20A", "3/4\" (20A)"]
      to: "3/4\""
      seen: "d009 NPS 3/4"
    - from: ["1\"", "1 IN", "NPS 1", "DN25", "25A", "1\" (25A)"]
      to: "1\""
      seen: "d007 1\" (25A)"
    - from: ["1-1/2\"", "1 1/2\"", "1.5\"", "NPS 1-1/2", "DN40", "40A"]
      to: "1-1/2\""
    - from: ["2\"", "2 IN", "NPS 2", "DN50", "50A", "2\" (50A)"]
      to: "2\""
    - from: ["3\"", "3 IN", "NPS 3", "DN80", "80A", "3\" (80A)"]
      to: "3\""
    - from: ["4\"", "4 IN", "NPS 4", "DN100", "100A", "4\" (100A)"]
      to: "4\""
    - from: ["6\"", "6 IN", "NPS 6", "DN150", "150A"]
      to: "6\""
    - from: ["8\"", "8 IN", "NPS 8", "DN200", "200A"]
      to: "8\""

  # 본체 형상
  valve_body_type:
    - from: ["GLOBE", "GLOBE VALVE", "GLOBE (DOUBLE)", "GLOBE(SINGLE)"]
      to: "GLOBE"
    - from: ["ANGLE", "ANGLE VALVE"]
      to: "ANGLE"
    - from: ["BALL", "BALL VALVE", "SEGMENT BALL"]
      to: "BALL"
    - from: ["BUTTERFLY", "BTFY"]
      to: "BUTTERFLY"

  # 구동부 형식 — 1986년 Fisher 양식은 체크박스 문구가 "Diaph." 다.
  # 공압/역작동 같은 수식어는 표준값에서 뗀다. `actuator_type` 은 **구동 방식**을
  # 담는 항목이고, 역작동(RA)은 별개 속성이며 이 30필드에 자리가 없다.
  # 원문은 감사 시트에 남으므로 정보가 사라지지 않는다.
  actuator_type:
    - from: ["DIAPHRAGM", "DIAPH.", "DIAPH", "PNEUMATIC DIAPHRAGM",
             "DIAPHRAGM RA", "DIAPHRAGM (RA)", "SPRING DIAPHRAGM",
             "PNEUMATIC DIAPH."]
      to: "DIAPHRAGM"
      seen: "d001~d003 Diaph. / d005 · d010 PNEUMATIC DIAPHRAGM / d007 DIAPHRAGM RA"
    - from: ["CYLINDER", "VL CYLINDER", "PNEUMATIC CYLINDER", "PISTON",
             "PISTON CYLINDER"]
      to: "CYLINDER"
      seen: "d008 · d014 VL Cylinder (FLOWSERVE 양식)"
    - from: ["ELECTRIC", "MOTOR", "ELECTRIC MOTOR"]
      to: "ELECTRIC"

  # 포지셔너 제조사 — 본체 제조사와 다를 수 있다(본체 FISHER + 포지셔너 SMC).
  # 문서에 제조사가 없고 모델명만 있는 경우가 많아 model_to_manufacturer 가
  # 함께 동작한다.
  positioner_manufacturer:
    - from: ["FISHER CONTROLS", "FISHER CONTROLS INTERNATIONAL", "NIPPON FISHER"]
      to: "FISHER"
      seen: "3582G · 3582 → FISHER (모델명 판단 11건)"
    - from: ["FLOWSERVE CORPORATION", "FLOWSERVE KOREA", "VALTEK"]
      to: "FLOWSERVE"
      seen: "d014 Logix 3800 Series"
    - from: ["SMC CORPORATION", "SMC KOREA"]
      to: "SMC"
      seen: "d0xx SMC 2건"
    - from: ["NIIGATA MASONEILAN", "MASONEILAN DRESSER", "DRESSER MASONEILAN"]
      to: "MASONEILAN"
      seen: "d0xx Masoneilan"
    - from: ["AZBIL CORPORATION", "YAMATAKE", "YAMATAKE-HONEYWELL"]
      to: "AZBIL"
      seen: "d0xx Azbil"
    - from: ["YOUNG TECH", "YOUNG TECH CO.", "YTC"]
      to: "YTC"
      seen: "d013 YT-1200 (모델명 판단)"

  # 유체 상태 — 닫힌 어휘이고 이웃이 멀어 안전하다.
  fluid_state:
    - from: ["LIQUID", "LIQ.", "LIQ"]
      to: "LIQUID"
    - from: ["GAS", "GASEOUS"]
      to: "GAS"
    - from: ["VAPOR", "VAPOUR"]
      to: "VAPOR"
    - from: ["STEAM"]
      to: "STEAM"

# ── 모델명 → 제조사 ───────────────────────────────────────────
#
# 왜 필요한가 (2026-08-24)
#   데이터시트에 제조사가 안 적혀 있고 모델명만 있는 경우가 많다. 골든셋 11건
#   중 6건이 그랬다 — `3582G` 만 적혀 있는데 정답은 `FISHER` 다.
#
#   그 지식이 라벨러 머릿속에만 있으면 AI 는 영구히 오답이다. 문서에는 `3582G`
#   밖에 없으니까. 여기 적어두면 규칙이 되고, 도메인 전문가가 검토할 수 있고,
#   AI 도 같은 값을 낸다(철학 2).
#
# 쓰는 곳
#   ① VLM 프롬프트 — 이 표를 함께 넣어, 제조사가 안 적혀 있으면 모델명으로
#      판단하게 한다. 판단 근거를 `transform_trace` 에 남긴다
#   ② Normalize — VLM 이 놓쳤을 때 모델명으로 채운다
#
# ⚠️ 이것은 **추정이 아니라 사실**이다(`3582G` 는 Fisher 제품이다). 다만 문서에
#    없는 값을 채우는 것이므로 `transform_trace` 에 "모델명 3582G → Fisher
#    (rules.yaml)" 를 남겨 사람이 되짚을 수 있게 한다.
#
# 채우는 방법 — 접두어 매칭. 긴 접두어를 먼저 검사한다.
model_to_manufacturer:
  enabled: true
  note: "골든셋에서 관측된 것만. 상상해서 늘리지 않는다 — 실물에서 나온 것만 추가"
  rules:
    # ── 밸브 본체·액추에이터 ──
    - prefix: ["667", "657", "1052", "1061", "471", "480"]
      to: "FISHER"
      kind: actuator
      seen: "d001 667-EZ · d002/d004 667-ED · d003/d006 657-ED"
    - prefix: ["EZ", "ED", "ES", "HP", "CAV"]
      to: "FISHER"
      kind: body
      note: "본체 모델. 결합 표기의 뒷자리 (667-EZ 의 EZ)"
    - prefix: ["627", "98", "95", "1098", "MR95", "63EG"]
      to: "FISHER"
      kind: regulator
      seen: "d009 627 — Direct Operated Regulator"
    - prefix: ["GU", "VDR", "RE", "RF"]
      to: "METSO"
      kind: body
      seen: "d005 GU-VDR"
    - prefix: ["MARK ONE", "MARK 1", "MARKONE"]
      to: "FLOWSERVE"
      kind: body
      seen: "d008 Mark One"
    - prefix: ["V100", "V200"]
      to: "UNICON"
      kind: body
      seen: "d007 V100 SERIES"
    - prefix: ["2121", "1121", "880"]
      to: "VALSTONE"
      kind: body
      seen: "d010 2121 · d011 880-2221"

    # ── 포지셔너 ── (필드가 다르므로 positioner_manufacturer 로 들어간다)
    - prefix: ["3582", "3570", "DVC"]
      to: "FISHER"
      kind: positioner
      seen: "d001~d003/d006 3582G · d007 DVC6200 HC"
    - prefix: ["4200", "SVI"]
      to: "MASONEILAN"
      kind: positioner
      seen: "d004 4200P"
    - prefix: ["AVP"]
      to: "AZBIL"
      kind: positioner
      seen: "d005 AVP-302"
    - prefix: ["IP", "I/P"]
      to: "SMC"
      kind: positioner
      seen: "d010 I/P5000 · d011 IP8000"
    - prefix: ["YT"]
      to: "YTC"
      kind: positioner
      note: "Young Tech. 15LV010 에서 YT-200 관측"
# ── 단위 토큰 ──────────────────────────────────────────────────
# 라벨과 값 사이에 단위 칸이 끼는 양식이 있다.
#   예) "Flow Rate | m3/h | ... | 20"  ← m3/h 를 값으로 집으면 안 된다
# 파서가 값을 찾을 때 이 목록에 걸리면 건너뛴다. 표기가 늘어나면 여기에 추가한다.
unit_tokens:
  - kg/cm2
  - kg/cm2G
  - kg/cm²
  - kgf/cm2
  - kgf/cm2G
  - kgf/cm²
  - kg/h
  - kg/hr
  - m3/h
  - m3/hr
  - M3/H
  - Sm3/h
  - Sm3/hr
  - Nm3/h
  - Nm3/hr
  - ℓ/min
  - l/min
  - "%"
  - "℃"
  - "°C"
  - "˚C"
  - mm
  - in
  - inch
  - cP
  - Cp
  - mA
  - dBA
  - psi
  - psig
  - bar
  - kPa
  - MPa
  - min
  - sec
  - deg.
  - "(mm)"
  - "(mA)"
  - "(%)"
  - "(°C)"
  - "(kg/h)"
  - "(Sp.Gr.)"

# ── 복합 라벨 분해 ─────────────────────────────────────────────
# 라벨 하나가 표준 필드 여러 개를 덮는 칸. 벤더 양식에서 흔하다.
# 1:1 유사표현 사전으로는 풀 수 없어 별도 규칙으로 쪼갠다.
#
# 형식 두 가지
#   separator : 라벨과 값을 같은 구분자로 쪼개 순서대로 짝짓는다.
#               fields 의 null 은 "대응 표준 필드 없음 → 버림".
#               조각 수가 fields 수와 다르면 쪼개지 않고 미매핑으로 남긴다.
#   pattern   : 값에 정규식을 걸고 named group 이름을 field key 로 쓴다.
#
# 스키마에 아직 없는 field key 를 적어도 된다. 그 조각은 미매핑으로 남고,
# 필드가 추가되는 순간 규칙 수정 없이 자동으로 붙는다.
composite_labels:

  - label: "Size/Pressure Class/Body Form"
    separator: "/"
    fields: [valve_body_size, valve_body_rating, valve_body_type]
    note: "Fisher·Samwoo 계열 텍스트 PDF"

  - label: "Model / Body Type / Trim Type"
    separator: "/"
    fields: [model_no, valve_body_type, null]
    note: |
      Trim Type("Standard")은 트림 구조 표기이지 유량 특성이 아니다.
      CHARACTERISTIC 은 같은 문서의 "Trim # - Cv / Characteristic"("Linear")에서 온다.
      2026-08-24 골든셋 대조에서 확인 — 대응 필드 없음으로 정정.

  - label: "Max Shutoff / Shutoff Class"
    separator: "/"
    fields: [null, valve_leakage_class]
    note: "앞 조각(최대 차압)은 마스터 스키마에 대응 필드 없음"

  - label: "Fail/Air-To"
    separator: "/"
    fields: [actuator_fail_action, null]
    note: |
      Fail 표기와 Air-To 표기를 한 칸에 같이 준다. 예) "Close / Open"
      앞 조각이 Fail 값이므로 그대로 쓴다. 뒤 조각은 역전 규칙 교차검증에 쓸 수 있다.
      (Fail=Close 이면 Air-To=Open 이어야 정합)

  - label: "Design Press./Temp."
    separator: "/"
    fields: [null, null]
    note: "설계 조건. 마스터 스키마는 Max/Normal/Min 만 있어 대응 필드 없음 — 버림"

  - label: "Process Fluid"
    separator: "/"
    fields: [fluid_name, fluid_state]
    note: "Flowserve 계열. 값이 'LS AR / LIQUID' 형태로 유체명과 상태를 묶어 준다"

  - label: "Size and Type"
    pattern: '^\s*(?P<valve_body_size>[\d\-/½¼¾\.]+\s*")\s*,?\s*(?P<model_no>\S.*?)\s*$'
    note: |
      Fisher 1986 수기 양식. 값이 '1" 1250R-GL' / '2", 657-EZ' 형태로
      바디 사이즈와 모델번호를 한 칸에 묶어 준다.
      유사표현으로 넣으면 두 필드가 같은 표기를 다투므로 복합 규칙으로 둔다.

  - label: "Body Matl / Bonnet Matl"
    separator: "/"
    fields: [valve_body_material, null]
    note: "Flowserve·Valtek 계열. 뒤 조각(보닛 재질)은 마스터 스키마에 대응 필드 없음"

  - label: "Trim # - Cv / Characteristic"
    separator: "/"
    fields: [null, characteristic]
    note: |
      앞 조각은 "2.62  Cv:116" 형태로 트림번호와 정격 Cv 가 묶여 있다.
      Cv 필드 이름이 확정되면(RATED CV / RATED CV MAX) pattern 규칙으로 바꿔 앞 조각도 살릴 것.

  - label: "Body Model(Type)"
    pattern: '^(?P<model_no>[^(]+)\((?P<valve_body_type>[^)]+)\)$'
    note: "한국어 리트로핏 점검서. 값이 '657-ED(GLOBE)' 형태로 모델과 바디 형상을 묶어 준다"

# ── To-be (MVP 범위 외) ───────────────────────────────────────
unit_conversion:
  enabled: false
  note: "MVP 는 원문 표기 보존. 향후 분류별 단위를 고정하고 변환까지 구현"

# ── 허용 어휘 ─────────────────────────────────────────────────
#
# 표준화와 검증은 **같은 표의 앞뒷면**이다.
#   표에 있으면  → 표준값으로 매핑한다        (value_aliases)
#   표에 없으면  → 확인필요로 표시하고 후보 큐에 쌓는다
#
# 어휘가 **불완전한 상태에서 유사 보정을 켜면 오염된다.** 그래서 두 층으로
# 나눈다 — correct 는 값을 바꾸고, flag_only 는 표시만 한다.
#
# 제외한 것과 이유
#   actuator_fail_action  안전 필드. Fail Open/Close 가 어휘 안에서 이웃이라
#                         유사 보정이 가장 잘 걸리고 틀리면 가장 비싸다
#   engineering_tag_no    식별 필드. 10-FV-002 와 10-FV-003 은 거리 1이다
#   model_no · fluid_name · equipment_full_description   열린 값
#   수치 필드             어휘가 아니라 단위 문제다
enum_allowed_values:
  enabled: true

  # 값을 표준값으로 바꾼다. 허용값은 value_aliases 의 to 값이 곧 그것이다
  # (한 곳에만 적어 어긋나지 않게 한다).
  correct:
    - manufacturer
    - positioner_manufacturer
    - valve_body_rating
    - valve_body_type
    - valve_leakage_class
    - characteristic
    - actuator_type
    - valve_body_size
    - fluid_state

  # 값을 바꾸지 않는다. 어휘 밖이면 확인필요로 표시만 한다.
  #
  # 재질을 여기 두는 이유 — 골든셋 19건에 본체 재질만 13종이고, 한두 글자
  # 차이로 서로 다른 등급이 공존한다.
  #     C5   ASTM A217 Cr-Mo      CS   탄소강      WC5  A217 다른 등급
  # 보정하면 다른 재질로 바꿔치기한다. 표시만 하면 위험이 0이고, 사람이
  # 승인하면 어휘가 자란다(Loop C).
  flag_only:
    # 안전 필드 — **보정 대상이 아니다.** 값을 바꾸는 것은 금지이고,
    # 어휘 밖이면 사람에게 보내기만 한다. 검증은 값을 건드리지 않으므로
    # 안전 필드에서도 위험이 없다. 실측에서 이 필드가 "표시를 놓친 칸" 의
    # 최대 항목이었다(17칸 중 7칸) — 표시할 수단이 아예 없었기 때문이다.
    actuator_fail_action: ["FAIL OPEN", "FAIL CLOSE"]

    valve_body_material:
      ["A105", "A216 WCB", "A216 GR WCB", "A216 GR-WCB", "ASTM A216 GR-WCB",
       "WCB", "WCB STEEL", "WCC", "WCC STEEL", "CARBON STEEL(WCB)",
       "C5", "WC5", "CR-MO C5; F5A", "A217 C5", "A217 WC5",
       "A351 CF8M", "CF8M", "A352 LCB", "LCB"]
    valve_plug_material:
      ["316 SS", "316 SST", "316L SST", "SUS316", "SUS316L", "SUS403",
       "410 SS HT", "316 SST/COCR-A", "316 SST / COCR-A", "316 SST W/COCR-A",
       "316 SST + STELLITE", "316 SS + STF", "SUS316 + STELL.", "COCR-A",
       "SUS 316/COCR-A"]      # d023 — 시트 어휘에 있던 표기가 플러그에도 나왔다
    valve_cage_material:
      ["17-4PH SST", "316 SS", "316 SST", "SUS316", "SUS403", "SUS440B",
       "440 SST", "416 SS HT", "316 SST / ENC", "COCR-A"]
    valve_seat_material:
      ["316 SS", "316 SST", "SUS403", "SCS14A", "SCS14A + STELLITE",
       "CAST COCR-A", "COCR-A", "316 SST + STELLITE", "316 SST / COCR-A",
       "316 SST W/COCR-A", "SUS 316/COCR-A", "316 SS + STF", "410 SS HT",
       "NBR"]
    valve_stem_material:
      ["316 SS", "316 SST", "SUS316", "SUS316L", "INCONEL",
       "316SST + CR PLATE", "ALLOY 6, LGA", "17-4PH SST",
       # 1986 Fisher 양식은 재질 행에 "Std." 체크박스를 둔다. 벤더 기본
       # 사양이라는 뜻이고, **비어 있는 것과 다르다** — 문서가 명시적으로
       # 표준품이라고 말한 것이다. 다만 마스터에서 조회할 때는 재질명이
       # 아니므로 카탈로그 조회가 따로 필요하다.
       "STD.", "STD", "STANDARD"]
