# 정규화 · 변환 규칙표
#
# 소유: 서경빈 선임 (표기 매핑) / 이종수 책임 (도메인 규칙)
# 코드에 규칙을 넣지 말고 이 파일에 추가한다.

meta:
  version: "0.1.0"
  note: "MVP — 단위 변환과 범주형 허용값은 범위 외(To-be)"

# ── 도메인 규칙 ────────────────────────────────────────────────
# 문서 표기가 표준값과 다른 의미를 갖는 경우. 역전 매핑 주의.
domain_rules:
  actuator_fail_action:
    description: "데이터시트는 공기 작용 방향(ATO/ATC)으로 기재하고, 표준값은 공기 상실 시 거동(Fail)이다. 서로 반대다."
    map:
      - from: ["AIR TO OPEN", "AIR-TO-OPEN", "ATO", "A/O"]
        to: "FAIL CLOSE"
        trace: "ATO → 공기 상실 시 스프링 폐쇄 → Fail Close"
      - from: ["AIR TO CLOSE", "AIR-TO-CLOSE", "ATC", "A/C"]
        to: "FAIL OPEN"
        trace: "ATC → 공기 상실 시 스프링 개방 → Fail Open"
      - from: ["FAIL LAST", "FAIL IN PLACE", "FAIL LOCK"]
        to: "FAIL LAST"
        trace: "직접 기재"
    # ── 직접 기재 표기 (2026-08-24) ────────────────────────────
    # 위 map 은 값 자체가 ATO/ATC 인 경우다. 그런데 대부분의 양식은
    # 라벨이 이미 "공기 상실 시" 를 뜻하고 값에는 방향만 적는다.
    #   "Air Fails Valve to : Close"  → FAIL CLOSE   (라벨이 직접 기재)
    #   "Air to Actuator   : Open"    → FAIL CLOSE   (라벨이 역전. 값과 반대)
    # 값만 보면 둘 다 그냥 Close/Open 이라 구분이 불가능하다. **라벨을 봐야 한다.**
    #
    # 골든셋 11건의 원문라벨은 전부 직접 기재였다 —
    #   Air Fails Valve to · Fail Position · Failure Mode · Actuator Fail
    direct_labels:
      - "AIR FAILS VALVE TO"
      - "FAIL POSITION"
      - "FAIL ACTION"
      - "FAILURE MODE"
      - "ACTUATOR FAIL"
      - "ACTUATOR FAILURE MODE"
      - "FAIL SAFE POSITION"
      - "FAIL SAFE"
    direct_map:
      # `VALVE OPEN` · `VALVE CLOSE` 는 2026-08-24 평가에서 관측 (d007 · d010)
      - from: ["OPEN", "TO OPEN", "OPENS", "FO", "F.O.", "개방",
               "VALVE OPEN", "VALVE OPENS", "V/V OPEN", "OPEN POSITION",
               "FAIL OPEN", "FAIL-OPEN", "FAIL TO OPEN"]
        to: "FAIL OPEN"
        trace: "라벨이 직접 기재 — 공기 상실 시 개방"
      - from: ["CLOSE", "CLOSED", "TO CLOSE", "CLOSES", "FC", "F.C.", "폐쇄",
               "VALVE CLOSE", "VALVE CLOSED", "V/V CLOSE", "CLOSE POSITION",
               "FAIL CLOSE", "FAIL-CLOSE", "FAIL TO CLOSE"]
        to: "FAIL CLOSE"
        trace: "라벨이 직접 기재 — 공기 상실 시 폐쇄"
      - from: ["LOCK", "LAST", "IN PLACE", "LOCKED", "정지"]
        to: "FAIL LAST"
        trace: "라벨이 직접 기재 — 공기 상실 시 현 위치 유지"
    # 라벨이 이 목록에 없고 값도 ATO/ATC 가 아니면 **변환하지 않는다.**
    # 역전 여부를 모르는 상태에서 방향을 정하면 안전 사양을 뒤집을 수 있다.
    cross_check: []
    # 2026-08-23 결정 — ACTUATOR TYPE 은 추출 대상이 아니다(구동부는 FAIL POSITION 만).
    # 따라서 자동 교차검증이 불가하고, 사람 확인이 유일한 안전장치다.
    # 지침은 schema/guidance.yaml : fields.actuator_fail_action 에 자연어로 있다.
    cross_check_note: "ACTUATOR TYPE 추출 대상 외 → 자동 교차검증 불가"

# ── 표기 매핑 ──────────────────────────────────────────────────
# 같은 값의 다른 표기. **평가 실행에서 실제로 나온 것만 넣는다.**
# 상상해서 늘리면 문서에 없는 값을 맞다고 판정하게 된다.
#
# 2026-08-24 첫 VLM 실행(68%)의 오답 30건 중 13건이 "값은 맞고 표기만 다름"
# 이었다. 아래는 그때 관측된 표기다. 출처를 seen 에 남긴다.
value_aliases:

  # 등급 — 단일 필드 최대 실패(7건). ANSI/ASME/CL 접두어가 붙거나 안 붙는다.
  valve_body_rating:
    - from: ["ANSI CLASS 150", "ASME CLASS 150", "ASME CL.150", "CL 150",
             "CLASS 150", "ANSI 150", "ASME 150#", "150 LB", "150LB", "150", "150#", "150 RF"]
      to: "150#"
    - from: ["ANSI CLASS 300", "ASME CLASS 300", "ASME CL.300", "CL 300",
             "CLASS 300", "ANSI 300", "ASME 300#", "300 LB", "300LB", "300", "300#", "300 RF", "ANSI 300 RF", "CL300-RF Flg"]
      to: "300#"
      seen: "d005 · d006 ANSI CLASS 300 / d010 ASME 300# / d011 ASME CLASS 300"
    - from: ["ANSI CLASS 600", "ASME CLASS 600", "ASME CL.600", "CL 600",
             "CLASS 600", "ANSI 600", "ASME 600#", "600 LB", "600LB", "600", "600#", "600 RF"]
      to: "600#"
      seen: "d004 ANSI CLASS 600 / d007 ASME CL.600"
    - from: ["ANSI CLASS 900", "ASME CL.900", "CL 900", "CLASS 900", "900", "900#"]
      to: "900#"
    - from: ["ANSI CLASS 1500", "ASME CLASS 1500", "ASME CL.1500", "CL 1500",
             "CLASS 1500", "ANSI 1500", "1500", "1500#", "ASME 1500#"]
      to: "1500#"
      seen: "d008 CL 1500"
    - from: ["ANSI CLASS 2500", "ASME CL.2500", "CL 2500", "CLASS 2500", "2500", "2500#"]
      to: "2500#"

  # 제조사 — 법인명 접미(Controls · Co.,Ltd. · Inc.)가 붙는다. 짧은 형으로 통일.
  # ⚠ 구두점이 뜻을 바꾸는 필드는 punct_significant 에 적는다(이 파일 아래).
  #   회사명은 CO.,LTD. 의 점을 지워야 맞고, 크기는 1/2" 의 사선을 지우면 틀린다.
  manufacturer:
    - from: ["FISHER CONTROLS", "FISHER CONTROLS INTERNATIONAL",
             "NIPPON FISHER", "NIPPON FISHER CO.,LTD.", "FISHER CO.,LTD.", "EMERSON FISHER", "NIPPON FISHER CO.,LTD.", "EMERSON FISHER"]
      to: "FISHER"
      seen: "d001 Fisher Controls"
    - from: ["METSO AUTOMATION", "METSO KOREA", "METSO KOREA CO., LTD.",
             "METSO FLOW CONTROL", "NELES", "METSO VALSTONE", "METSO VALSTONE INC."]
      to: "METSO"
    - from: ["VALSTONE CONTROLS, INC.", "VALSTONE CONTROLS",
             "VALSTONE SERVICE, CO.", "VALSTONE SERVICE CO.", "VALSTONE SERVICE"]
      to: "VALSTONE"
      seen: "d011 VALSTONE CONTROLS, INC."
    - from: ["UNICON SYSTEM CO.,LTD.", "UNICON SYSTEM", "UNICON SYSTEM CO.", "UNICON VALVE", "UNICON CO., LTD."]
      to: "UNICON"
      seen: "d007 UNICON SYSTEM CO.,LTD."
    - from: ["FLOWSERVE CORPORATION", "FLOWSERVE KOREA", "VALTEK", "FLOWSERVE VALTEK", "FLOWSERVE VALTEK"]
      to: "FLOWSERVE"
    # N/ 은 일본 합작사 표기의 축약이다 — 니가타인지 닛폰인지는 문서만으로
    # 확정할 수 없으나 어느 쪽이든 모브랜드는 같다. NIPPON FISHER → FISHER 와
    # 같은 처리다. d022 · d023 두 건에서 확신도 0.99 로 그대로 나왔다.
    - from: ["NIIGATA MASONEILAN", "MASONEILAN DRESSER", "DRESSER MASONEILAN",
             "N/MASONEILAN", "N/ MASONEILAN", "N/MASONEILAN CO.,LTD.", "BAKER HUGHES MASONEILAN", "BAKER HUGHES MASONEILAN"]
      to: "MASONEILAN"
      seen: "d006 NIIGATA MASONEILAN — 단 이 건의 정답은 FISHER 였다(별칭이 아니라 오독) / d022 · d023 N/MASONEILAN"
    - from: ["AZBIL CORPORATION", "YAMATAKE", "YAMATAKE-HONEYWELL", "AZBIL YAMATAKE", "AZBIL YAMATAKE"]
      to: "AZBIL"

  # 누설등급 — 로마자·아라비아가 섞인다. **표준값은 아라비아**다
  # (2026-08-25 결정: 조회하는 사람이 숫자 4를 먼저 떠올린다).
  # 표준(ANSI/FCI 70-2)의 표기법은 로마자이지만, 그것은 문서의 표기법이고
  # DB 열의 표기법은 쓰는 사람 기준으로 정한다. 원문은 감사 시트에 남는다.

    # ── 원격에서 받음 — 우리 골든셋에 없던 벤더
    - from: ["AUTOMAX USA", "AUTOMAX INC."]
      to: "AUTOMAX"
    - from: ["SAMWOO TECH", "SAMWOO TECH CO., LTD."]
      to: "SAMWOO"
    - from: ["YOUNG TECH", "YOUNG TECH CO., LTD.", "YOUNG TECH CO., LTD."]
      to: "YTC"
  valve_leakage_class:
    # Class I 은 "착좌 누설 규정 없음" 을 뜻하는 실재 등급이다. d028 에서 나왔다.
    - from: ["ANSI CLASS I", "ANSI CLASS 1", "CLASS I", "CLASS 1", "ANSI I", "FCI CLASS I"]
      to: "CLASS 1"
      seen: "d028 CLASS 1"
    - from: ["ANSI CLASS II", "ANSI CLASS 2", "CLASS II", "CLASS 2", "ANSI II", "FCI CLASS II"]
      to: "CLASS 2"
    - from: ["ANSI CLASS III", "ANSI CLASS 3", "CLASS III", "CLASS 3"]
      to: "CLASS 3"
    - from: ["ANSI CLASS IV", "ANSI CLASS 4", "CLASS IV", "CLASS 4", "ANSI IV", "FCI CLASS IV", "ANSI/FCI 70-2 CLASS 4", "ANSI/FCI 70-2 CLASS IV"]
      to: "CLASS 4"
      seen: "d004 · d006 CLASS 4 / d005 · d007 CLASS IV / d008 Class IV"
    - from: ["ANSI CLASS V", "ANSI CLASS 5", "CLASS V", "CLASS 5", "FCI CLASS V"]
      to: "CLASS 5"
    - from: ["ANSI CLASS VI", "ANSI CLASS 6", "CLASS VI", "CLASS 6", "FCI CLASS VI"]
      to: "CLASS 6"

  # 유량 특성
  characteristic:
    - from: ["EQ%", "EQ %", "EQUAL PERCENT", "EQUAL %", "EQUAL PERCENTAGE",
             "%EQ", "EQUAL-PERCENT"]
      to: "EQUAL PERCENTAGE"
      seen: "d001~d003 Equal Percent / d005 · d010 · d011 EQ%"
    - from: ["MODIFIED PERCENTAGE", "MODIFIED EQUAL PERCENT", "MOD. EQ%",
             "MODIFIED %"]
      to: "MODIFIED PERCENTAGE"
      seen: "d004"
    - from: ["LINEAR", "LIN."]
      to: "LINEAR"
    - from: ["QUICK OPENING", "Q.O.", "QO"]
      to: "QUICK OPENING"

  # 본체 크기 — 규격 접미(25A·NPS·DN)가 붙는다. 2026-08-24 평가에서 관측.
  # 값 자체는 인치 표기로 통일한다 — 마스터DB 에 25A 와 1" 가 섞이면 안 된다.
  valve_body_size:
    - from: ["1/2\"", "1/2 IN", "NPS 1/2", "DN15", "15A", "1/2\" (15A)"]
      to: "1/2\""
    - from: ["3/4\"", "3/4 IN", "NPS 3/4", "DN20", "20A", "3/4\" (20A)"]
      to: "3/4\""
      seen: "d009 NPS 3/4"
    - from: ["1\"", "1 IN", "NPS 1", "DN25", "25A", "1\" (25A)"]
      to: "1\""
      seen: "d007 1\" (25A)"
    - from: ["1-1/2\"", "1 1/2\"", "1.5\"", "NPS 1-1/2", "DN40", "40A"]
      to: "1-1/2\""
    - from: ["2\"", "2 IN", "NPS 2", "DN50", "50A", "2\" (50A)"]
      to: "2\""
    - from: ["3\"", "3 IN", "NPS 3", "DN80", "80A", "3\" (80A)"]
      to: "3\""
    - from: ["4\"", "4 IN", "NPS 4", "DN100", "100A", "4\" (100A)"]
      to: "4\""
    - from: ["6\"", "6 IN", "NPS 6", "DN150", "150A"]
      to: "6\""
    - from: ["8\"", "8 IN", "NPS 8", "DN200", "200A"]
      to: "8\""
    # 8" 위가 비어 있었다. 골든셋 21건에 큰 밸브가 없어서 드러나지 않았고,
    # 그 사이 12" 가 1/2" 로 보정되고 있었다(punct_significant 로 수정).
    - from: ["10\"", "10 IN", "NPS 10", "DN250", "250A"]
      to: "10\""
    - from: ["12\"", "12 IN", "NPS 12", "DN300", "300A"]
      to: "12\""
      seen: "d032 12\""
    - from: ["14\"", "14 IN", "NPS 14", "DN350", "350A"]
      to: "14\""
    - from: ["16\"", "16 IN", "NPS 16", "DN400", "400A"]
      to: "16\""
    - from: ["18\"", "18 IN", "NPS 18", "DN450", "450A"]
      to: "18\""
    - from: ["20\"", "20 IN", "NPS 20", "DN500", "500A"]
      to: "20\""
    - from: ["24\"", "24 IN", "NPS 24", "DN600", "600A"]
      to: "24\""

  # 본체 형상
  valve_body_type:
    - from: ["GLOBE", "GLOBE VALVE", "GLOBE (DOUBLE)", "GLOBE(SINGLE)"]
      to: "GLOBE"
    - from: ["ANGLE", "ANGLE VALVE"]
      to: "ANGLE"
    # 피시테일은 버터플라이 디스크의 한 형식이다. BUTTERFLY 로 합칠지는
    # 도메인 판단이라 합치지 않았다 — 문서가 적은 대로 둔다(철학 4).
    - from: ["FISHTAIL BUTTERFLY", "FISH TAIL BUTTERFLY", "FISHTAIL"]
      to: "FISHTAIL BUTTERFLY"
      seen: "d028 FISHTAIL BUTTERFLY"
    - from: ["BALL", "BALL VALVE", "SEGMENT BALL"]
      to: "BALL"
    - from: ["BUTTERFLY", "BTFY"]
      to: "BUTTERFLY"

  # 구동부 형식 — 1986년 Fisher 양식은 체크박스 문구가 "Diaph." 다.
  # 공압/역작동 같은 수식어는 표준값에서 뗀다. `actuator_type` 은 **구동 방식**을
  # 담는 항목이고, 역작동(RA)은 별개 속성이며 이 30필드에 자리가 없다.
  # 원문은 감사 시트에 남으므로 정보가 사라지지 않는다.
  actuator_type:
    - from: ["DIAPHRAGM", "DIAPH.", "DIAPH", "PNEUMATIC DIAPHRAGM",
             "DIAPHRAGM RA", "DIAPHRAGM (RA)", "SPRING DIAPHRAGM",
             "PNEUMATIC DIAPH."]
      to: "DIAPHRAGM"
      seen: "d001~d003 Diaph. / d005 · d010 PNEUMATIC DIAPHRAGM / d007 DIAPHRAGM RA"
    - from: ["CYLINDER", "VL CYLINDER", "PNEUMATIC CYLINDER", "PISTON",
             "PISTON CYLINDER"]
      to: "CYLINDER"
      seen: "d008 · d014 VL Cylinder (FLOWSERVE 양식)"
    - from: ["ELECTRIC", "MOTOR", "ELECTRIC MOTOR"]
      to: "ELECTRIC"

  # 포지셔너 제조사 — 본체 제조사와 다를 수 있다(본체 FISHER + 포지셔너 SMC).
  # 문서에 제조사가 없고 모델명만 있는 경우가 많아 model_to_manufacturer 가
  # 함께 동작한다.
  positioner_manufacturer:
    - from: ["FISHER CONTROLS", "FISHER CONTROLS INTERNATIONAL", "NIPPON FISHER"]
      to: "FISHER"
      seen: "3582G · 3582 → FISHER (모델명 판단 11건)"
    - from: ["FLOWSERVE CORPORATION", "FLOWSERVE KOREA", "VALTEK"]
      to: "FLOWSERVE"
      seen: "d014 Logix 3800 Series"
    - from: ["SMC CORPORATION", "SMC KOREA"]
      to: "SMC"
      seen: "d0xx SMC 2건"
    - from: ["NIIGATA MASONEILAN", "MASONEILAN DRESSER", "DRESSER MASONEILAN"]
      to: "MASONEILAN"
      seen: "d0xx Masoneilan"
    - from: ["AZBIL CORPORATION", "YAMATAKE", "YAMATAKE-HONEYWELL"]
      to: "AZBIL"
      seen: "d0xx Azbil"
    - from: ["YOUNG TECH", "YOUNG TECH CO.", "YTC"]
      to: "YTC"
      seen: "d013 YT-1200 (모델명 판단)"

  # 유체 상태 — 닫힌 어휘이고 이웃이 멀어 안전하다.

    # ── 원격에서 받음 — 우리 골든셋에 없던 벤더
    - from: ["METSO KOREA", "METSO AUTOMATION", "METSO FLOW CONTROL", "NELES", "METSO VALSTONE", "METSO VALSTONE INC."]
      to: "METSO"
    - from: ["VALSTONE CONTROLS", "VALSTONE CONTROLS, INC.", "VALSTONE SERVICE", "VALSTONE SERVICE. CO.", "VALSTONE SERVICE, CO."]
      to: "VALSTONE"
    - from: ["UNICON VALVE", "UNICON CO., LTD."]
      to: "UNICON"
    - from: ["AUTOMAX USA", "AUTOMAX INC."]
      to: "AUTOMAX"
    - from: ["SAMWOO TECH", "SAMWOO TECH CO., LTD."]
      to: "SAMWOO"
  fluid_state:
    - from: ["LIQUID", "LIQ.", "LIQ"]
      to: "LIQUID"
    - from: ["GAS", "GASEOUS"]
      to: "GAS"
    - from: ["VAPOR", "VAPOUR"]
      to: "VAPOR"
    - from: ["STEAM"]
      to: "STEAM"

# ── 모델명 → 제조사 ───────────────────────────────────────────
#
# 왜 필요한가 (2026-08-24)
#   데이터시트에 제조사가 안 적혀 있고 모델명만 있는 경우가 많다. 골든셋 11건
#   중 6건이 그랬다 — `3582G` 만 적혀 있는데 정답은 `FISHER` 다.
#
#   그 지식이 라벨러 머릿속에만 있으면 AI 는 영구히 오답이다. 문서에는 `3582G`
#   밖에 없으니까. 여기 적어두면 규칙이 되고, 도메인 전문가가 검토할 수 있고,
#   AI 도 같은 값을 낸다(철학 2).
#
# 쓰는 곳
#   ① VLM 프롬프트 — 이 표를 함께 넣어, 제조사가 안 적혀 있으면 모델명으로
#      판단하게 한다. 판단 근거를 `transform_trace` 에 남긴다
#   ② Normalize — VLM 이 놓쳤을 때 모델명으로 채운다
#
# ⚠️ 이것은 **추정이 아니라 사실**이다(`3582G` 는 Fisher 제품이다). 다만 문서에
#    없는 값을 채우는 것이므로 `transform_trace` 에 "모델명 3582G → Fisher
#    (rules.yaml)" 를 남겨 사람이 되짚을 수 있게 한다.
#
# 채우는 방법 — 접두어 매칭. 긴 접두어를 먼저 검사한다.

  # ── 원격에서 받음 — 수치 대조 스위치 ──────────────────────────
  # 이 필드들은 표기 별칭이 아니라 **숫자로 대조**한다. 0.85 와 .85 가
  # 같은 값이라는 것을 채점기가 알아야 한다.
  normal_flow_rate:
    - numeric: true
  normal_pressure:
    - numeric: true
  normal_temperature:
    - numeric: true
  rated_cv:
    - numeric: true
  required_cv:
    - numeric: true
  specific_gravity:
    - numeric: true
  viscosity:
    - numeric: true

  # ── 대조 전용 (compare_only) ──────────────────────────────
  # 두 경로가 'CLOSE' 와 'FAIL CLOSE' 를 냈으면 같은 뜻이다 — 대조에서 불일치로
  # 세면 사람을 헛되이 부른다. 그러나 **보정에는 쓰지 않는다.** 안전 필드이고
  # `AIR TO CLOSE`(공기가 닫음 = 끊기면 열림) 같은 역전 표기가 있어 값만 보고
  # 방향을 정할 수 없다. 방향 판정은 domain_rules 의 라벨 검사가 한다.
  actuator_fail_action:
    - from: ["VALVE CLOSE", "VALVE CLOSED", "CLOSE", "CLOSED"]
      to: "FAIL CLOSE"
      compare_only: true
    - from: ["VALVE OPEN", "VALVE OPENED", "OPEN", "OPENED"]
      to: "FAIL OPEN"
      compare_only: true

model_to_manufacturer:
  enabled: true
  note: "골든셋에서 관측된 것만. 상상해서 늘리지 않는다 — 실물에서 나온 것만 추가"
  rules:
    # ── 밸브 본체·액추에이터 ──
    - prefix: ["667", "657", "1052", "1061", "471", "480"]
      to: "FISHER"
