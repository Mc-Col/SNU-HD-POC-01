# ── 복합 라벨 분해 ─────────────────────────────────────────────
# 라벨 하나가 표준 필드 여러 개를 덮는 칸. 벤더 양식에서 흔하다.
# 1:1 유사표현 사전으로는 풀 수 없어 별도 규칙으로 쪼갠다.
#
# 형식 두 가지
#   separator : 라벨과 값을 같은 구분자로 쪼개 순서대로 짝짓는다.
#               fields 의 null 은 "대응 표준 필드 없음 → 버림".
#               조각 수가 fields 수와 다르면 쪼개지 않고 미매핑으로 남긴다.
#   pattern   : 값에 정규식을 걸고 named group 이름을 field key 로 쓴다.
#
# 스키마에 아직 없는 field key 를 적어도 된다. 그 조각은 미매핑으로 남고,
# 필드가 추가되는 순간 규칙 수정 없이 자동으로 붙는다.

  # ── 원격에서 받음 — 우리 파일에 없던 항목
  - "Deg C"
  - "Deg.C"
  - "deg C"
  - "SG"
  - "Sp. Gr."
  - "Kg/cm2A"
  - "Cv"

composite_labels:

  - label: "Size/Pressure Class/Body Form"
    separator: "/"
    fields: [valve_body_size, valve_body_rating, valve_body_type]
    note: "Fisher·Samwoo 계열 텍스트 PDF"

  - label: "Model / Body Type / Trim Type"
    separator: "/"
    fields: [model_no, valve_body_type, null]
    note: |
      Trim Type("Standard")은 트림 구조 표기이지 유량 특성이 아니다.
      CHARACTERISTIC 은 같은 문서의 "Trim # - Cv / Characteristic"("Linear")에서 온다.
      2026-08-24 골든셋 대조에서 확인 — 대응 필드 없음으로 정정.

  - label: "Max Shutoff / Shutoff Class"
    separator: "/"
    fields: [null, valve_leakage_class]
    note: "앞 조각(최대 차압)은 마스터 스키마에 대응 필드 없음"

  - label: "Fail/Air-To"
    separator: "/"
    fields: [actuator_fail_action, null]
    note: |
      Fail 표기와 Air-To 표기를 한 칸에 같이 준다. 예) "Close / Open"
      앞 조각이 Fail 값이므로 그대로 쓴다. 뒤 조각은 역전 규칙 교차검증에 쓸 수 있다.
      (Fail=Close 이면 Air-To=Open 이어야 정합)

  - label: "Design Press./Temp."
    separator: "/"
    fields: [null, null]
    note: "설계 조건. 마스터 스키마는 Max/Normal/Min 만 있어 대응 필드 없음 — 버림"

  - label: "Process Fluid"
    separator: "/"
    fields: [fluid_name, fluid_state]
    note: "Flowserve 계열. 값이 'LS AR / LIQUID' 형태로 유체명과 상태를 묶어 준다"

  - label: "Size and Type"
    pattern: '^\s*(?P<valve_body_size>[\d\-/½¼¾\.]+\s*")\s*,?\s*(?P<model_no>\S.*?)\s*$'
    note: |
      Fisher 1986 수기 양식. 값이 '1" 1250R-GL' / '2", 657-EZ' 형태로
      바디 사이즈와 모델번호를 한 칸에 묶어 준다.
      유사표현으로 넣으면 두 필드가 같은 표기를 다투므로 복합 규칙으로 둔다.

  - label: "Body Matl / Bonnet Matl"
    separator: "/"
    fields: [valve_body_material, null]
    note: "Flowserve·Valtek 계열. 뒤 조각(보닛 재질)은 마스터 스키마에 대응 필드 없음"

  - label: "Trim # - Cv / Characteristic"
    separator: "/"
    fields: [null, characteristic]
    note: |
      앞 조각은 "2.62  Cv:116" 형태로 트림번호와 정격 Cv 가 묶여 있다.
      Cv 필드 이름이 확정되면(RATED CV / RATED CV MAX) pattern 규칙으로 바꿔 앞 조각도 살릴 것.

  - label: "Body Model(Type)"
    pattern: '^(?P<model_no>[^(]+)\((?P<valve_body_type>[^)]+)\)$'
    note: "한국어 리트로핏 점검서. 값이 '657-ED(GLOBE)' 형태로 모델과 바디 형상을 묶어 준다"

# ── 값 칸에 우리 필드가 아닌 부가 표기가 붙어 있는 경우 (2026-08-26) ──
#
# 왜 복합 규칙으로 두는가
#   "값을 잘라내는 규칙" 을 따로 만들지 않는다. 부가 표기는 **한 칸에 들어 있는
#   두 번째 값**이므로 복합 라벨과 같은 문제다. 같은 기계로 처리하면 버려지는
#   조각이 미매핑으로 남아 **데이터를 잃지 않는다** — 버린 데이터는 못 되살린다.
#
# 왜 안전한가
#   pattern 은 fullmatch 다. 형태가 맞지 않으면 규칙이 아예 걸리지 않고 평소
#   경로로 간다. 그래서 이 표기가 없는 문서에는 영향이 없다.
#
# note_ 로 시작하는 조각은 필드 키가 아니므로 미매핑으로 빠진다 — 값에서는
# 떨어지고 기록에는 남는다.

  - label: "Stem"
    pattern: '^\s*(?P<valve_stem_material>[^(]+?)\s*\((?P<note_stem_size>[^)]*)\)\s*$'
    note: |
      44LV001. 재질 칸에 스템 치수를 괄호로 덧붙인다 — 'SUS316            (1/2")'.
      재질 필드에 치수가 섞이면 어휘 검증도 통과하지 못한다.
      괄호가 없으면 규칙이 걸리지 않는다.

  - label: "Body Size"
    pattern: '^\s*(?P<valve_body_size>[\d\-/\.]+\s*")\s*[Xx×]\s*(?P<note_port_size>[\d\-/\.]+\s*")\s*$'
    note: |
      B10LV1073 TEST 시트. '4" X 2.62"' 는 본체 크기 × 포트(시트) 지름이다.
      VALVE BODY SIZE 는 본체 크기이므로 앞을 쓴다. 뒤는 트림 쪽 정보로 남긴다.
      ⚠ 구두점이 뜻을 바꾸는 필드다(punct_significant) — 1/2" 를 12" 로 만들지 않도록
        분수·소수·하이픈을 모두 살려 잡는다.

  - label: "Rated Cv"
    pattern: '^\s*(?P<rated_cv>[\d\.]+)\s*\(\s*(?P<note_cg>[Cc][Gg]\s*=[^)]*)\)\s*$'
    note: |
      10PV018. '195 (Cg=4040 → 7580)' — Cv 와 Cg 가 한 칸에 있다.
      **Cg 는 Cv 와 다른 양이다** (Cg = C1 x Cv, C1 은 밸브 형식마다 33~37).
      T7 정책(2026-08-26 확정) — Cv 가 함께 있으면 옆 칸 오집 문제이므로 Cv 를 쓰고,
      **Cg 값 자체는 버리지 않고 note 로 남긴다.** 4040 을 RATED CV 로 적으면
      실제 195 대비 20배 틀린 값이 마스터에 들어간다.
      ⚠ Cv 가 없고 Cg 만 있는 칸은 이 규칙에 걸리지 않는다 — 그 경우는 값 칸을
        막아야 하고, 그것은 ④ Normalize·도메인 검증 몫이다(미구현).

# ── To-be (MVP 범위 외) ───────────────────────────────────────

  # ── 원격에서 받음 — 우리 파일에 없던 항목
  - label: Size/Pressure Class/Body Form
    separator: /
    fields:
    - valve_body_size
    - valve_body_rating
    - null
    note: 'Fisher·Samwoo 계열 텍스트 PDF.
    
      세 번째 조각은 대응 필드 없음 — Body Form 은 주조·단조 구분(Cast/Forged)이지
    
      밸브 형식이 아니다. 19FV077 값이 "2.00 / CL 1500 / Cast" 인데 골든셋 정답은
    
      Globe 이고, 그 값은 같은 문서의 "Valve Model / Body Type" 줄에 있다.
    
      2026-08-25 골든셋 대조에서 정정.
    
      '
  - label: Model No. / Mfr.
    separator: ','
    fields:
    - positioner_model_no
    - positioner_manufacturer
    note: '52PV014 값 예: "I/P5000, SMC" — 모델, 제조사 순.
    
      값이 한 조각뿐이면(10FV079 "AVP-302") 규칙이 발동하지 않고,
    
      같은 라벨이 POSITIONER MODEL NO. 의 구역 한정 유사표현으로 잡힌다.
    
      '
  - label: Act. Type/Matl
    separator: /
    fields:
    - actuator_type
    - null
    note: '값 예: ''VL Cylinder / Aluminum'' — 뒤는 액추에이터 재질(우리 필드 아님)'
  - label: Max Shutoff / Shutoff Class
    separator: /
    fields:
    - null
    - valve_leakage_class
    note: '값 예: ''27.000 kg/cm² / Class V'' — 앞은 최대 차압(우리 필드 아님)'
  - label: Plug Matl / Facing
    separator: /
    fields:
    - valve_plug_material
    - null
    note: '값 예: ''410 SS HT /'' — 뒤는 표면처리'
  - label: Stem Matl / Facing
    separator: /
    fields:
    - valve_stem_material
    - null
  - label: Seat Ring Matl / Facing
    separator: /
    fields:
    - valve_seat_material
    - null
  - label: Seat Ring Mtl/ Facing|Treatment
    separator: /
    fields:
    - valve_seat_material
    - null
  - label: Seat Retainer Mtl/ Facing|Treatment
    separator: /
    fields:
    - valve_cage_material
    - null
    note: Valtek 은 케이지를 Seat Retainer 라고 부른다 (킷 라벨링에서 확인)
  - label: Valve Model / Body Type
    separator: /
    fields:
    - model_no
    - valve_body_type
    - null
    note: '19FV077 — 라벨은 두 조각인데 값은 "Mark One / Globe / Standard" 로 세 조각이다.
    
      세 번째는 트림 구조라 대응 필드가 없다.
    
      '

unit_conversion:
  enabled: false
  note: "MVP 는 원문 표기 보존. 향후 분류별 단위를 고정하고 변환까지 구현"

# ── 허용 어휘 ─────────────────────────────────────────────────
#
# 표준화와 검증은 **같은 표의 앞뒷면**이다.
#   표에 있으면  → 표준값으로 매핑한다        (value_aliases)
#   표에 없으면  → 확인필요로 표시하고 후보 큐에 쌓는다
#
# 어휘가 **불완전한 상태에서 유사 보정을 켜면 오염된다.** 그래서 두 층으로
# 나눈다 — correct 는 값을 바꾸고, flag_only 는 표시만 한다.
#
# 제외한 것과 이유
#   actuator_fail_action  안전 필드. Fail Open/Close 가 어휘 안에서 이웃이라
#                         유사 보정이 가장 잘 걸리고 틀리면 가장 비싸다
#   engineering_tag_no    식별 필드. 10-FV-002 와 10-FV-003 은 거리 1이다
#   model_no · fluid_name · equipment_full_description   열린 값
#   수치 필드             어휘가 아니라 단위 문제다
enum_allowed_values:
  enabled: true

  # 값을 표준값으로 바꾼다. 허용값은 value_aliases 의 to 값이 곧 그것이다
  # (한 곳에만 적어 어긋나지 않게 한다).
  correct:
    - manufacturer
    - positioner_manufacturer
    - valve_body_rating
    - valve_body_type
    - valve_leakage_class
    - characteristic
    - actuator_type
    - valve_body_size
    - fluid_state

  # 값을 바꾸지 않는다. 어휘 밖이면 확인필요로 표시만 한다.
  #
  # 재질을 여기 두는 이유 — 골든셋 19건에 본체 재질만 13종이고, 한두 글자
  # 차이로 서로 다른 등급이 공존한다.
  #     C5   ASTM A217 Cr-Mo      CS   탄소강      WC5  A217 다른 등급
  # 보정하면 다른 재질로 바꿔치기한다. 표시만 하면 위험이 0이고, 사람이
  # 승인하면 어휘가 자란다(Loop C).
  flag_only:
    # 안전 필드 — **보정 대상이 아니다.** 값을 바꾸는 것은 금지이고,
    # 어휘 밖이면 사람에게 보내기만 한다. 검증은 값을 건드리지 않으므로
    # 안전 필드에서도 위험이 없다. 실측에서 이 필드가 "표시를 놓친 칸" 의
    # 최대 항목이었다(17칸 중 7칸) — 표시할 수단이 아예 없었기 때문이다.
    actuator_fail_action: ["FAIL OPEN", "FAIL CLOSE"]

    valve_body_material:
      ["A105", "A216 WCB", "A216 GR WCB", "A216 GR-WCB", "ASTM A216 GR-WCB",
       "WCB", "WCB STEEL", "WCC", "WCC STEEL", "CARBON STEEL(WCB)",
       "C5", "WC5", "CR-MO C5; F5A", "A217 C5", "A217 WC5",
       "A351 CF8M", "CF8M", "A352 LCB", "LCB"]
    valve_plug_material:
      ["316 SS", "316 SST", "316L SST", "SUS316", "SUS316L", "SUS403",
       "410 SS HT", "316 SST/COCR-A", "316 SST / COCR-A", "316 SST W/COCR-A",
       "316 SST + STELLITE", "316 SS + STF", "SUS316 + STELL.", "COCR-A",
       "SUS 316/COCR-A"]      # d023 — 시트 어휘에 있던 표기가 플러그에도 나왔다
    valve_cage_material:
      ["17-4PH SST", "316 SS", "316 SST", "SUS316", "SUS403", "SUS440B",
       "440 SST", "416 SS HT", "316 SST / ENC", "COCR-A"]
    valve_seat_material:
      ["316 SS", "316 SST", "SUS403", "SCS14A", "SCS14A + STELLITE",
       "CAST COCR-A", "COCR-A", "316 SST + STELLITE", "316 SST / COCR-A",
       "316 SST W/COCR-A", "SUS 316/COCR-A", "316 SS + STF", "410 SS HT",
       "NBR"]
    valve_stem_material:
      ["316 SS", "316 SST", "SUS316", "SUS316L", "INCONEL",
       "316SST + CR PLATE", "ALLOY 6, LGA", "17-4PH SST",
       # 1986 Fisher 양식은 재질 행에 "Std." 체크박스를 둔다. 벤더 기본
       # 사양이라는 뜻이고, **비어 있는 것과 다르다** — 문서가 명시적으로
       # 표준품이라고 말한 것이다. 다만 마스터에서 조회할 때는 재질명이
       # 아니므로 카탈로그 조회가 따로 필요하다.
       "STD.", "STD", "STANDARD"]

# ── 구두점이 뜻을 바꾸는 필드 ────────────────────────────────
# 별칭 대조는 기본적으로 영숫자만 남긴다(회사명 CO.,LTD. 의 점은 잡음이다).
# 그런데 치수는 구두점이 값 자체다 — 사선·소수점을 지우면 다른 크기가 된다.
#
#   1/2"   → 12   ═══  12"   → 12      12인치가 1/2인치로 보정된다
#   1.5"   → 15   ═══  15"   → 15
#   1-1/2" → 112  ═══  112"  → 112
#
# 실제로 일어났다 — 조원 골든셋 10PV081(d044) 의 12" 가 1/2" 로 보정됐다.
# 우리 골든셋 21건에 큰 밸브가 없어서 보이지 않았다.
# 여기 적힌 필드는 / . - 를 살려서 대조한다. 표에 없는 표기는 보정하지 않고
# 어휘 검증이 후보 큐로 올린다 — 그것이 옳은 동작이다.
punct_significant:
  - valve_body_size

# ── 원격에서 받음 (format_rules) ──────────────────────────────
format_rules:

  # ── 식별 ──
  engineering_tag_no:
    tag: true                 # preprocess.parse_tag() 로 판정 (Area-설비종류-일련번호)
    max_length: 20            # 실측 최대 10 ('10-FV-007A')

  # ── 숫자 필드 — 정답 전부가 숫자를 포함했다 ──
  normal_flow_rate:   { numeric: true, max_length: 30 }   # 실측 11 ('142.6 m3/Hr')
  normal_pressure:    { numeric: true, max_length: 30 }   # 실측 13 ('205 kg/cm2(g)')
  normal_temperature: { numeric: true, max_length: 30 }   # 실측 7
  specific_gravity:   { numeric: true, max_length: 20 }   # 실측 5
  viscosity:          { numeric: true, max_length: 20 }   # 실측 5
  rated_cv:           { numeric: true, max_length: 20 }   # 실측 5
  required_cv:        { numeric: true, max_length: 20 }   # 실측 6
  # 아래 둘은 unit_only 를 켜지 않는다 — 정답에 설명 글자가 정상으로 들어온다
  # ('ANSI CLASS 300' · 'IN DIA. 200 mm'). 숫자가 있는지만 본다.
  valve_body_size:    { numeric: true, max_length: 30 }   # 실측 14 ('IN DIA. 200 mm')
  valve_body_rating:  { numeric: true, max_length: 30 }   # 실측 14 ('ANSI CLASS 300')
                                                          # 등급에는 반드시 숫자가 있다.
                                                          # 'RF FLANGED' 같은 연결 형식이
                                                          # 들어오면 여기서 잡힌다

  # ── 글자 필드 — 길이만 본다 ──
  type_name:                  { max_length: 60 }   # 실측 25
  equipment_full_description: { max_length: 80 }
  manufacturer:               { max_length: 60 }   # 실측 23
  model_no:                   { max_length: 40 }   # 실측 11
  fluid_name:                 { max_length: 40 }   # 실측 14
  fluid_state:                { max_length: 20 }   # 실측 6
  valve_body_type:            { max_length: 30 }   # 실측 5
  valve_body_material:        { max_length: 40 }   # 실측 17
  valve_leakage_class:        { max_length: 30 }   # 실측 13
  characteristic:             { max_length: 40 }   # 실측 19
  valve_plug_material:        { max_length: 40 }   # 실측 18
  valve_cage_material:        { max_length: 40 }   # 실측 13
  valve_seat_material:        { max_length: 40 }   # 실측 18
  valve_stem_material:        { max_length: 40 }   # 실측 17
  actuator_type:              { max_length: 40 }   # 실측 19
  actuator_fail_action:       { max_length: 20 }   # 실측 10 ('Fail Close')
  positioner_manufacturer:    { max_length: 60 }   # 실측 10
  positioner_model_no:        { max_length: 40 }   # 실측 22

# ── 구역(section) 사전 ─────────────────────────────────────────
#
# 무엇인가 (2026-08-25)
#   데이터시트는 밸브 한 대의 사양을 부품별로 묶어 적는다. 그래서 같은 항목명이
#   부품마다 나온다 — 52PV014 한 장에 `Model`(밸브 본체 2121) · `Model No.`
#   (액추에이터 880) · `Model No. / Mfr.`(포지셔너 I/P5000) 가 같이 있다.
#   이름만 보면 어느 것이 우리가 찾는 MODEL NO. 인지 알 수 없다.
#
#   문서는 답을 갖고 있다. 묶음마다 이름표가 붙어 있다 — PDF 는 여백에 90도
#   회전된 글자로, 엑셀은 세로로 병합된 셀로. 그 이름표가 구역이다.
#
# 어떻게 쓰는가
#   유사표현은 이름만 등록하되 **한 이름을 여러 필드에 등록**하고, 구역으로
#   고른다. 결합 키("VALVE BODY / BONNET Model")로 등록하지 않는 이유는
#   구역 표기 변종만큼 사전이 배로 늘기 때문이다.
#
# ⚠️ 여기 등록된 이름만 구역으로 인정한다. 10PV018 정비보고서에는
#    `Authorized by` 같은 세로 병합 셀이 5개 있는데, 사전에 없으니 무시된다.
#    오탐을 막는 장치다.


# ── 원격에서 받음 (sections) ──────────────────────────────
sections:

  # 문서에 적힌 구역 표기 → 표준 구역. 실물 6건에서 수집했다
  # (10FV079 · 52PV014 · 15LV015 · 19FV077 · 11FV502 · 44LV001).
  aliases:
    GENERAL: general

    SERVICE CONDITION: service
    SERVICE CONDITIONS: service
    Process Data For Control Valve Selection: service     # Fisher·Valtek 계열
    Calculated Data: service                              # 요구 Cv·소음 계산값

    VALVE BODY / BONNET: body
    VALVE BODY: body
    BODY: body
    Valve Body Assembly: body        # 이 양식은 바디 블록이 트림 재질까지 담는다

    TRIM: trim
    VALVE TRIM: trim

    # 재질만 따로 묶는 양식이 있다 (15LV015 · 44LV001). 이 블록에는 바디 재질과
    # 트림 재질이 함께 들어오므로 재질 필드를 전부 허용한다.
    MATERIAL: material
    MATERIALS: material

    ACTUATOR: actuator
    "ACT'N": actuator
    Actuator: actuator

    POSITIONER: positioner
    Positioner: positioner

    # 아래는 우리 28필드에 대응이 없는 구역이다. 표준 구역으로 인정하되
    # 허용 필드를 비워, 이 안의 라벨은 값을 만들지 못하게 한다.
    LINE: none
    NOTES: none
    "SOLENOID V/V": none
    "SOL. V/V": none
    Solenoid: none
    "LIMIT SW": none
    "LIMIT SW.": none
    "Pos Ind Sw": none
    ACCESSORIES: none
    "ACCESS.": none
    "ACC. OTHERS": none
    OTHERS: none
    Others: none
    "MISC.": none
    TRANSDUCER: none
    "Certs Req": none
    "Special Req": none
    "Customer Spec": none

  # 표준 구역에서 나올 수 있는 필드. 여기 없는 필드는 그 구역에서 매핑하지 않는다.
  #
  # 좁게 잡으면 맞던 것이 미추출로 바뀐다. 실물 블록 안에 실제로 들어 있는
  # 항목을 보고 정했다 — 예를 들어 19FV077 의 `Valve Body Assembly` 는 바디
  # 어셈블리라면서 트림 재질(Plug Matl · Stem Matl · Seat Ring Matl)까지 담는다.
  fields:
    # general 과 service 는 허용 목록을 같이 쓴다. 문서 위쪽의 식별·공정 정보가
    # 한 덩어리이고, 회전 이름표가 블록 중앙에 서기 때문에 둘 사이 경계가 ±10pt
    # 흔들린다(52PV014 에서 `Flow Rate`·`Inlet Pressure` 가 GENERAL 로 넘어갔다).
    # 우리가 가르려는 것은 부품(본체·트림·액추에이터·포지셔너)이지 이 둘이 아니다.
    general: &document_level
      - engineering_tag_no
      - equipment_full_description
      - type_name
      - manufacturer
      - model_no
      - fluid_name
      - fluid_state
      - normal_flow_rate
      - normal_pressure
      - normal_temperature
      - specific_gravity
      - viscosity
      - required_cv
      - rated_cv

    service: *document_level

    body:
      - manufacturer
      - model_no
      - valve_body_size
      - valve_body_rating
      - valve_body_type
      - valve_body_material
      - valve_leakage_class
      - characteristic
      - rated_cv
      # 바디 블록이 트림 재질까지 담는 양식(19FV077)이 있다
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    trim:
      - characteristic
      - rated_cv
      - valve_leakage_class
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    material:
      - valve_body_material
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    actuator:
      - actuator_type
      - actuator_fail_action

    positioner:
      - positioner_manufacturer
      - positioner_model_no

    none: []

# ── 복합 라벨 분해 ─────────────────────────────────────────────
# 라벨 하나가 표준 필드 여러 개를 덮는 칸. 벤더 양식에서 흔하다.
# 1:1 유사표현 사전으로는 풀 수 없어 별도 규칙으로 쪼갠다.
#
# 형식 두 가지
#   separator : 라벨과 값을 같은 구분자로 쪼개 순서대로 짝짓는다.
#               fields 의 null 은 "대응 표준 필드 없음 → 버림".
#               조각 수가 fields 수와 다르면 쪼개지 않고 미매핑으로 남긴다.
#   pattern   : 값에 정규식을 걸고 named group 이름을 field key 로 쓴다.
#
# 스키마에 아직 없는 field key 를 적어도 된다. 그 조각은 미매핑으로 남고,
# 필드가 추가되는 순간 규칙 수정 없이 자동으로 붙는다.


derived_fields:
  enabled: true

  type_name:
    from: engineering_tag_no
    how: tag_kind                  # 태그의 설비종류 두세 글자로 판정
    map:
      FV: "Flow Control Valve"
      LV: "Level Control Valve"
      PV: "Pressure Control Valve"
      TV: "Temperature Control Valve"
      HV: "Hand Valve"
      XV: "On-Off Valve"
      PCV: "Pressure Control Valve"
      PDV: "Pressure Differential Valve"
      FCV: "Flow Control Valve"
      LCV: "Level Control Valve"
      TCV: "Temperature Control Valve"
    exceptions:
      - "11-LV-001 은 LV 태그인데 골든셋 정답이 Flow Control Valve 다"
      - "22-PCV-013 은 PCV 인데 정답이 Direct Operated Regulator 다 (레귤레이터 계열)"
      - "→ 태그만으로는 확정되지 않는다. 그래서 REVIEW 로 보낸다"

  # fluid_state 는 도출하지 않는다 (2026-08-26 협의).
  #   유체명만으로는 상태를 확정할 수 없는 경우가 있다 — 같은 유체가 공정 조건에
  #   따라 액체이기도 기체이기도 하고, 이상(two-phase) 흐름도 있다. 골든셋 30건에서
  #   낱말 규칙(STEAM/GAS → GAS)이 전부 맞았지만 그것은 표본이 좁아서다.
  #   ③-b 가 문서에서 못 읽으면 채우지 않고 NA 로 둔다 — 사람이 판단한다.

# ── 숫자 표기 통일 ───────────────────────────────────────────
#
# `.933` 과 `0.933` 은 같은 값이다. 그런데 마스터 열에 `.933` 이 들어가면
# 조회·정렬이 깨지고, 실행마다 어느 쪽으로 나올지 흔들려 A/B 비교를 흐린다.
#
# ⚠ **정확도 개선이 아니다.** 개발셋 830칸에서 이것으로 되찾는 칸은 **2개**
#    (0.24%)이고 실행 간 편차(~27칸) 안에 묻힌다. 성능 개선으로 계상하지 않는다.
#    데이터 품질과 측정 안정성 항목이다.
numeric_format:
  enabled: true
  leading_zero: true          # .933 → 0.933
  # ⚠ 뒤 0 은 떼지 않는다. `14.000` 은 유럽식 천 단위 표기로 **1만 4천**이다
  #    (d036 정답이 그것이다). 떼면 14 가 되어 1000배 틀린다. 소수점의 뜻이
  #    양식마다 다르므로 값을 만지지 않는다.
  strip_trailing_zero: false
