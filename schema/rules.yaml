# 정규화 · 변환 규칙표
#
# 소유: 서경빈 선임 (표기 매핑) / 이종수 책임 (도메인 규칙)
# 코드에 규칙을 넣지 말고 이 파일에 추가한다.

meta:
  version: "0.1.0"
  note: "MVP — 단위 변환과 범주형 허용값은 범위 외(To-be)"

# ── 도메인 규칙 ────────────────────────────────────────────────
# 문서 표기가 표준값과 다른 의미를 갖는 경우. 역전 매핑 주의.
domain_rules:
  actuator_fail_action:
    description: "데이터시트는 공기 작용 방향(ATO/ATC)으로 기재하고, 표준값은 공기 상실 시 거동(Fail)이다. 서로 반대다."
    map:
      - from: ["AIR TO OPEN", "AIR-TO-OPEN", "ATO", "A/O"]
        to: "FAIL CLOSE"
        trace: "ATO → 공기 상실 시 스프링 폐쇄 → Fail Close"
      - from: ["AIR TO CLOSE", "AIR-TO-CLOSE", "ATC", "A/C"]
        to: "FAIL OPEN"
        trace: "ATC → 공기 상실 시 스프링 개방 → Fail Open"
      - from: ["FAIL LAST", "FAIL IN PLACE", "FAIL LOCK"]
        to: "FAIL LAST"
        trace: "직접 기재"
    cross_check: []
    # 2026-08-23 결정 — ACTUATOR TYPE 은 추출 대상이 아니다(구동부는 FAIL POSITION 만).
    # 따라서 자동 교차검증이 불가하고, 사람 확인이 유일한 안전장치다.
    # 지침은 schema/guidance.yaml : fields.actuator_fail_action 에 자연어로 있다.
    cross_check_note: "ACTUATOR TYPE 추출 대상 외 → 자동 교차검증 불가"

# ── 표기 매핑 ──────────────────────────────────────────────────
# 같은 값의 다른 표기. 라벨링 중 raw_label 로 수집되는 것을 여기에 누적한다.
value_aliases:
  # 예:
  # valve_body_material:
  #   - from: ["CS", "C.S.", "CARBON STEEL"]
  #     to: "CARBON STEEL"
  #
  # ── 숫자 필드 표시 (2026-08-25) ────────────────────────────────
  # `numeric: true` 면 값 대조에서 **글자를 통째로 무시하고 숫자만** 본다.
  # `eval/harness.py` 의 `_numeric()` 과 텍스트 파서 채점기가 여기를 읽는다.
  #
  # 왜 필요한가
  #   단위 어휘를 아무리 늘려도 못 잡는 경우가 있다.
  #     · 어휘에 없는 표기      `5Nm3/h`      → 정답을 숫자로 못 읽어 오답 처리
  #     · 글자가 깨진 표기      `(m?h)` `kg/cm?(g)`  (2026-08-24 실측)
  #   숫자 필드라고 알려주면 둘 다 통과한다. 재질·형식처럼 글자가 값인 필드에는
  #   절대 쓰지 않는다 — `A351 CF8M` 과 `A351 CF3M` 이 같아진다.
  normal_flow_rate:
    - numeric: true
  normal_pressure:
    - numeric: true
  normal_temperature:
    - numeric: true
  specific_gravity:
    - numeric: true
  viscosity:
    - numeric: true
  rated_cv:
    - numeric: true
  required_cv:
    - numeric: true
  actuator_fail_action:
    # 52PV014 의 "Fail Position" 칸 값이 "VALVE CLOSE" 다. 파서는 맞는 칸을 읽었고
    # 표준값으로 바꾸는 것은 ④ Normalize 몫이다 (2026-08-25).
    - from: ["VALVE CLOSE", "VALVE CLOSED", "CLOSE", "CLOSED"]
      to: "FAIL CLOSE"
    - from: ["VALVE OPEN", "VALVE OPENED", "OPEN", "OPENED"]
      to: "FAIL OPEN"

  # ── 표기 통일 (2026-08-26) ──────────────────────────────────────
  #
  # 왜 필요한가 — 실측
  #   골든셋 30건을 파이프라인으로 돌려 정답과 대조하니 **틀린 61칸 중 27칸이
  #   "값은 같고 표기만 다른" 것**이었다.
  #     등급 12건    600#  vs  ANSI CLASS 600
  #     제조사 11건  FISHER vs Fisher Controls
  #     사이즈 4건   1"    vs  1" (25A)
  #   마스터DB 에 이대로 들어가면 "Class 600 밸브가 몇 대인가" 를 셀 수 없다.
  #   이 과제가 없애려는 문제를 그대로 재생산한다.
  #
  # 표준형을 무엇으로 정했나
  #   등급     `CLASS 300`   ANSI 는 폐기된 명칭(ASME B16.34 로 이관), `#` 은 현장 약어
  #   누설등급 `CLASS IV`    ANSI/FCI 70-2 규격 자체가 로마자를 쓴다
  #   제조사   대문자 한 단어  법인명 접미(Co., Ltd. · Inc.)와 현지법인 표기를 접는다
  #   사이즈   인치 표기      `NPS 2` · `2"` 는 표기 차이다. **단위 변환은 하지 않는다**
  #            (`unit_conversion: enabled: false` 결정) — mm 표기는 손대지 않는다
  #
  # ⚠️ 원문을 지우지 않는다. `FieldRecord` 가 `value`(표준값) · `raw_value`(원문) ·
  #    `transform_trace`(근거)를 따로 담는다. 사람이 언제든 되짚을 수 있다.
  #
  # ⚠️ 여기 없는 표기는 그대로 둔다. 목록에 없다고 틀린 값이 아니다 —
  #    실물에서 관측된 것만 넣는다(짜맞추지 않는다).

  valve_body_rating:
    # ANSI/ASME 압력 등급. 숫자가 같으면 같은 등급이다.
    # RF·Flg 같은 플랜지 면 표기가 붙어 오는데, 그건 연결 형식이지 등급이 아니다.
    - from: ["150", "150#", "CL 150", "CL150", "ANSI 150", "ANSI CLASS 150",
             "ASME 150#", "ASME CL.150", "ASME CLASS 150", "150 RF", "CLASS 150"]
      to: "CLASS 150"
    - from: ["300", "300#", "CL 300", "CL300", "ANSI 300", "ANSI CLASS 300",
             "ASME 300#", "ASME CL.300", "ASME CLASS 300", "300 RF", "ANSI 300 RF",
             "CL300-RF Flg", "CLASS 300"]
      to: "CLASS 300"
    - from: ["600", "600#", "CL 600", "CL600", "ANSI 600", "ANSI CLASS 600",
             "ASME 600#", "ASME CL.600", "ASME CLASS 600", "600 RF", "CLASS 600"]
      to: "CLASS 600"
    - from: ["900", "900#", "CL 900", "ANSI CLASS 900", "CLASS 900"]
      to: "CLASS 900"
    - from: ["1500", "1500#", "CL 1500", "CL1500", "ANSI 1500", "ANSI CLASS 1500",
             "ASME 1500#", "ASME CL.1500", "CLASS 1500"]
      to: "CLASS 1500"
    - from: ["2500", "2500#", "CL 2500", "ANSI CLASS 2500", "CLASS 2500"]
      to: "CLASS 2500"
    # `MOP 150 PSIG`(댐퍼 최대 운전압력)는 ANSI 등급이 아니다 — 넣지 않는다

  valve_leakage_class:
    # ANSI/FCI 70-2. 규격이 로마자를 쓰므로 로마자로 통일한다.
    - from: ["CLASS 1", "CLASS I", "ANSI CLASS 1", "ANSI CLASS I", "FCI CLASS I"]
      to: "CLASS I"
    - from: ["CLASS 2", "CLASS II", "ANSI CLASS 2", "ANSI CLASS II", "FCI CLASS II"]
      to: "CLASS II"
    - from: ["CLASS 3", "CLASS III", "ANSI CLASS 3", "ANSI CLASS III"]
      to: "CLASS III"
    - from: ["CLASS 4", "CLASS IV", "ANSI CLASS 4", "ANSI CLASS IV", "FCI CLASS IV",
             "ANSI/FCI 70-2 CLASS 4", "ANSI/FCI 70-2 CLASS IV"]
      to: "CLASS IV"
    - from: ["CLASS 5", "CLASS V", "ANSI CLASS 5", "ANSI CLASS V", "FCI CLASS V"]
      to: "CLASS V"
    - from: ["CLASS 6", "CLASS VI", "ANSI CLASS 6", "ANSI CLASS VI", "FCI CLASS VI"]
      to: "CLASS VI"

  manufacturer: &maker_names
    # 법인명 접미와 현지법인 표기를 접는다. 같은 회사를 두 이름으로 세지 않기 위해서다.
    - from: ["FISHER", "FISHER CONTROLS", "FISHER CONTROLS INTERNATIONAL",
             "NIPPON FISHER", "NIPPON FISHER CO.,LTD.", "EMERSON FISHER"]
      to: "FISHER"
    - from: ["METSO", "METSO KOREA", "METSO AUTOMATION", "METSO FLOW CONTROL",
             "NELES", "METSO VALSTONE", "METSO VALSTONE INC."]
      to: "METSO"
    - from: ["VALSTONE", "VALSTONE CONTROLS", "VALSTONE CONTROLS, INC.",
             "VALSTONE SERVICE", "VALSTONE SERVICE. CO.", "VALSTONE SERVICE, CO."]
      to: "VALSTONE"
    - from: ["FLOWSERVE", "FLOWSERVE CORPORATION", "VALTEK", "FLOWSERVE VALTEK"]
      to: "FLOWSERVE"
    - from: ["MASONEILAN", "NIIGATA MASONEILAN", "DRESSER MASONEILAN",
             "BAKER HUGHES MASONEILAN"]
      to: "MASONEILAN"
    - from: ["UNICON", "UNICON VALVE", "UNICON CO., LTD."]
      to: "UNICON"
    - from: ["AUTOMAX", "AUTOMAX USA", "AUTOMAX INC."]
      to: "AUTOMAX"
    - from: ["SAMWOO", "SAMWOO TECH", "SAMWOO TECH CO., LTD."]
      to: "SAMWOO"
    - from: ["AZBIL", "YAMATAKE", "AZBIL YAMATAKE"]
      to: "AZBIL"
    - from: ["YTC", "YOUNG TECH", "YOUNG TECH CO., LTD."]
      to: "YTC"

  # 포지셔너 제조사도 같은 이름을 쓴다 (같은 회사가 밸브·포지셔너를 다 만든다)
  positioner_manufacturer: *maker_names

  valve_body_size:
    # 표기 차이만 접는다. 인치↔mm 변환은 MVP 범위 밖이다
    # (`unit_conversion: enabled: false`). mm 표기는 손대지 않는다.
    - from: ['3/4"', "NPS 3/4", "3/4 IN", "3/4IN", "3/4 INCH"]
      to: '3/4"'
    - from: ['1"', "NPS 1", "1 IN", "1IN", "1 INCH", '1" (25A)']
      to: '1"'
    - from: ['1-1/2"', "NPS 1-1/2", "1-1/2 IN", "1-1/2IN", "1 1/2 IN", '1-1/2" (40A)']
      to: '1-1/2"'
    - from: ['2"', "NPS 2", "2 IN", "2IN", "2 INCH", '2" (50A)']
      to: '2"'
    - from: ['3"', "NPS 3", "3 IN", "3IN", '3" (80A)']
      to: '3"'
    - from: ['4"', "NPS 4", "4 IN", "4IN", "4 INCH", '4" (100A)']
      to: '4"'
    - from: ['6"', "NPS 6", "6 IN", "6IN", '6" (150A)']
      to: '6"'
    - from: ['8"', "NPS 8", "8 IN", "8IN", '8" (200A)']
      to: '8"'
    - from: ['12"', "NPS 12", "12 IN", "12IN", '12" (300A)']
      to: '12"'

# ── 모델명 → 제조사 ───────────────────────────────────────────
#
# 왜 필요한가 (2026-08-24)
#   데이터시트에 제조사가 안 적혀 있고 모델명만 있는 경우가 많다. 골든셋 11건
#   중 6건이 그랬다 — `3582G` 만 적혀 있는데 정답은 `FISHER` 다.
#
#   그 지식이 라벨러 머릿속에만 있으면 AI 는 영구히 오답이다. 문서에는 `3582G`
#   밖에 없으니까. 여기 적어두면 규칙이 되고, 도메인 전문가가 검토할 수 있고,
#   AI 도 같은 값을 낸다(철학 2).
#
# 쓰는 곳
#   ① VLM 프롬프트 — 이 표를 함께 넣어, 제조사가 안 적혀 있으면 모델명으로
#      판단하게 한다. 판단 근거를 `transform_trace` 에 남긴다
#   ② Normalize — VLM 이 놓쳤을 때 모델명으로 채운다
#
# ⚠️ 이것은 **추정이 아니라 사실**이다(`3582G` 는 Fisher 제품이다). 다만 문서에
#    없는 값을 채우는 것이므로 `transform_trace` 에 "모델명 3582G → Fisher
#    (rules.yaml)" 를 남겨 사람이 되짚을 수 있게 한다.
#
# 채우는 방법 — 접두어 매칭. 긴 접두어를 먼저 검사한다.
model_to_manufacturer:
  enabled: true
  note: "골든셋에서 관측된 것만. 상상해서 늘리지 않는다 — 실물에서 나온 것만 추가"
  rules:
    # ── 밸브 본체·액추에이터 ──
    - prefix: ["667", "657", "1052", "1061", "471", "480"]
      to: "FISHER"
      kind: actuator
      seen: "d001 667-EZ · d002/d004 667-ED · d003/d006 657-ED"
    - prefix: ["EZ", "ED", "ES", "HP", "CAV"]
      to: "FISHER"
      kind: body
      note: "본체 모델. 결합 표기의 뒷자리 (667-EZ 의 EZ)"
    - prefix: ["627", "98", "95", "1098", "MR95", "63EG"]
      to: "FISHER"
      kind: regulator
      seen: "d009 627 — Direct Operated Regulator"
    - prefix: ["GU", "VDR", "RE", "RF"]
      to: "METSO"
      kind: body
      seen: "d005 GU-VDR"
    - prefix: ["MARK ONE", "MARK 1", "MARKONE"]
      to: "FLOWSERVE"
      kind: body
      seen: "d008 Mark One"
    - prefix: ["V100", "V200"]
      to: "UNICON"
      kind: body
      seen: "d007 V100 SERIES"
    - prefix: ["2121", "1121", "880"]
      to: "VALSTONE"
      kind: body
      seen: "d010 2121 · d011 880-2221"

    # ── 포지셔너 ── (필드가 다르므로 positioner_manufacturer 로 들어간다)
    - prefix: ["3582", "3570", "DVC"]
      to: "FISHER"
      kind: positioner
      seen: "d001~d003/d006 3582G · d007 DVC6200 HC"
    - prefix: ["4200", "SVI"]
      to: "MASONEILAN"
      kind: positioner
      seen: "d004 4200P"
    - prefix: ["AVP"]
      to: "AZBIL"
      kind: positioner
      seen: "d005 AVP-302"
    - prefix: ["IP", "I/P"]
      to: "SMC"
      kind: positioner
      seen: "d010 I/P5000 · d011 IP8000"
    - prefix: ["YT"]
      to: "YTC"
      kind: positioner
      note: "Young Tech. 15LV010 에서 YT-200 관측"
# ── 단위 토큰 ──────────────────────────────────────────────────
# 라벨과 값 사이에 단위 칸이 끼는 양식이 있다.
#   예) "Flow Rate | m3/h | ... | 20"  ← m3/h 를 값으로 집으면 안 된다
# 파서가 값을 찾을 때 이 목록에 걸리면 건너뛴다. 표기가 늘어나면 여기에 추가한다.
unit_tokens:
  - kg/cm2
  - kg/cm2G
  - kg/cm²
  - kgf/cm2
  - kgf/cm2G
  - kgf/cm²
  - kg/h
  - kg/hr
  - m3/h
  - m3/hr
  - M3/H
  - Sm3/h
  - Sm3/hr
  - Nm3/h
  - Nm3/hr
  - ℓ/min
  - l/min
  - "%"
  - "℃"
  - "°C"
  - "˚C"
  - mm
  - in
  - inch
  - cP
  - Cp
  - mA
  - dBA
  - psi
  - psig
  - bar
  - kPa
  - MPa
  - min
  - sec
  - deg.
  - "(mm)"
  - "(mA)"
  - "(%)"
  - "(°C)"
  - "(kg/h)"
  - "(Sp.Gr.)"
  # 2026-08-25 골든셋 21건 대조에서 값으로 잘못 집힌 표기
  - Deg C          # 15LV015 "Inlet Temperature | Deg C | 41"
  - Deg.C
  - deg C
  - SG             # 15LV015 "Specific Gravity | SG | 0.993"
  - Sp. Gr.        # 괄호 없는 표기가 빠져 있었다
  - Kg/cm2A
  - Cv             # 52PV014 "Required Cv | Cv | 75.7" — 유량계수의 단위 칸

# ── 형식 검증 규칙 (⑤-a) ───────────────────────────────────────
#
# 무엇을 보는가 (2026-08-25)
#   `src/validate/format` 이 읽는다. **형식만** 본다 — 값이 옳은지는 도메인
#   검증(⑤-b)과 사람의 몫이다. 위반을 찾아도 재시도를 걸지 않는다
#   (재시도는 "못 읽음" 에만. 값이 틀렸다고 모델에게 말하면 환각을 유도한다).
#
# 규칙을 어떻게 정했는가
#   골든셋 20건의 정답값을 실측해서 정했다. 상상으로 만든 규칙은 없다.
#     · numeric    : 그 필드의 정답이 **전부** 숫자를 포함한 필드만 지정
#     · max_length : 실측 최대 길이의 2배 안팎. 통째로 잘못 집힌 값(문장 한 줄)을
#                    잡는 용도이지 값을 재는 자가 아니다
#     · tag        : 태그 명명 규칙은 `preprocess.parse_tag()` 가 이미 안다.
#                    정규식을 여기 다시 쓰지 않는다
#
# ⚠️ 범주형 허용값 목록(GLOBE/BUTTERFLY …)은 MVP 범위 밖이다.
#    벤더 표기가 계속 나와서 목록을 닫으면 정상 값을 위반으로 잡는다.
#
# ⚠️ numeric 은 **단위 표기를 위반으로 보지 않는다.** 옛 데이터시트는 단위를
#    사람이 손으로 썼고 `142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다.
#    숫자가 하나라도 있으면 통과이고, 하나도 없으면 위반이다.
#
#    한 칸 더 좁혀 "숫자와 **알려진 단위**만 허용" 하는 규칙도 만들어 재봤다.
#    `약 53.8` 같은 값을 잡을 수 있지만, 골든셋 정답 3건을 오탐했다 —
#    `30 m3h`(슬래시 없음) · `205 kg/cm2(g)`(괄호 게이지 표기) · `8 g/cm2G`.
#    사람이 손으로 쓴 단위 변형은 어휘로 끝까지 못 따라간다(2026-08-25 실측).
#    그래서 켜지 않았다. 정상 값을 위반으로 부르는 검사는 쓸 수 없다.
format_rules:

  # ── 식별 ──
  engineering_tag_no:
    tag: true                 # preprocess.parse_tag() 로 판정 (Area-설비종류-일련번호)
    max_length: 20            # 실측 최대 10 ('10-FV-007A')

  # ── 숫자 필드 — 정답 전부가 숫자를 포함했다 ──
  normal_flow_rate:   { numeric: true, max_length: 30 }   # 실측 11 ('142.6 m3/Hr')
  normal_pressure:    { numeric: true, max_length: 30 }   # 실측 13 ('205 kg/cm2(g)')
  normal_temperature: { numeric: true, max_length: 30 }   # 실측 7
  specific_gravity:   { numeric: true, max_length: 20 }   # 실측 5
  viscosity:          { numeric: true, max_length: 20 }   # 실측 5
  rated_cv:           { numeric: true, max_length: 20 }   # 실측 5
  required_cv:        { numeric: true, max_length: 20 }   # 실측 6
  # 아래 둘은 unit_only 를 켜지 않는다 — 정답에 설명 글자가 정상으로 들어온다
  # ('ANSI CLASS 300' · 'IN DIA. 200 mm'). 숫자가 있는지만 본다.
  valve_body_size:    { numeric: true, max_length: 30 }   # 실측 14 ('IN DIA. 200 mm')
  valve_body_rating:  { numeric: true, max_length: 30 }   # 실측 14 ('ANSI CLASS 300')
                                                          # 등급에는 반드시 숫자가 있다.
                                                          # 'RF FLANGED' 같은 연결 형식이
                                                          # 들어오면 여기서 잡힌다

  # ── 글자 필드 — 길이만 본다 ──
  type_name:                  { max_length: 60 }   # 실측 25
  equipment_full_description: { max_length: 80 }
  manufacturer:               { max_length: 60 }   # 실측 23
  model_no:                   { max_length: 40 }   # 실측 11
  fluid_name:                 { max_length: 40 }   # 실측 14
  fluid_state:                { max_length: 20 }   # 실측 6
  valve_body_type:            { max_length: 30 }   # 실측 5
  valve_body_material:        { max_length: 40 }   # 실측 17
  valve_leakage_class:        { max_length: 30 }   # 실측 13
  characteristic:             { max_length: 40 }   # 실측 19
  valve_plug_material:        { max_length: 40 }   # 실측 18
  valve_cage_material:        { max_length: 40 }   # 실측 13
  valve_seat_material:        { max_length: 40 }   # 실측 18
  valve_stem_material:        { max_length: 40 }   # 실측 17
  actuator_type:              { max_length: 40 }   # 실측 19
  actuator_fail_action:       { max_length: 20 }   # 실측 10 ('Fail Close')
  positioner_manufacturer:    { max_length: 60 }   # 실측 10
  positioner_model_no:        { max_length: 40 }   # 실측 22

# ── 구역(section) 사전 ─────────────────────────────────────────
#
# 무엇인가 (2026-08-25)
#   데이터시트는 밸브 한 대의 사양을 부품별로 묶어 적는다. 그래서 같은 항목명이
#   부품마다 나온다 — 52PV014 한 장에 `Model`(밸브 본체 2121) · `Model No.`
#   (액추에이터 880) · `Model No. / Mfr.`(포지셔너 I/P5000) 가 같이 있다.
#   이름만 보면 어느 것이 우리가 찾는 MODEL NO. 인지 알 수 없다.
#
#   문서는 답을 갖고 있다. 묶음마다 이름표가 붙어 있다 — PDF 는 여백에 90도
#   회전된 글자로, 엑셀은 세로로 병합된 셀로. 그 이름표가 구역이다.
#
# 어떻게 쓰는가
#   유사표현은 이름만 등록하되 **한 이름을 여러 필드에 등록**하고, 구역으로
#   고른다. 결합 키("VALVE BODY / BONNET Model")로 등록하지 않는 이유는
#   구역 표기 변종만큼 사전이 배로 늘기 때문이다.
#
# ⚠️ 여기 등록된 이름만 구역으로 인정한다. 10PV018 정비보고서에는
#    `Authorized by` 같은 세로 병합 셀이 5개 있는데, 사전에 없으니 무시된다.
#    오탐을 막는 장치다.
sections:

  # 문서에 적힌 구역 표기 → 표준 구역. 실물 6건에서 수집했다
  # (10FV079 · 52PV014 · 15LV015 · 19FV077 · 11FV502 · 44LV001).
  aliases:
    GENERAL: general

    SERVICE CONDITION: service
    SERVICE CONDITIONS: service
    Process Data For Control Valve Selection: service     # Fisher·Valtek 계열
    Calculated Data: service                              # 요구 Cv·소음 계산값

    VALVE BODY / BONNET: body
    VALVE BODY: body
    BODY: body
    Valve Body Assembly: body        # 이 양식은 바디 블록이 트림 재질까지 담는다

    TRIM: trim
    VALVE TRIM: trim

    # 재질만 따로 묶는 양식이 있다 (15LV015 · 44LV001). 이 블록에는 바디 재질과
    # 트림 재질이 함께 들어오므로 재질 필드를 전부 허용한다.
    MATERIAL: material
    MATERIALS: material

    ACTUATOR: actuator
    "ACT'N": actuator
    Actuator: actuator

    POSITIONER: positioner
    Positioner: positioner

    # 아래는 우리 28필드에 대응이 없는 구역이다. 표준 구역으로 인정하되
    # 허용 필드를 비워, 이 안의 라벨은 값을 만들지 못하게 한다.
    LINE: none
    NOTES: none
    "SOLENOID V/V": none
    "SOL. V/V": none
    Solenoid: none
    "LIMIT SW": none
    "LIMIT SW.": none
    "Pos Ind Sw": none
    ACCESSORIES: none
    "ACCESS.": none
    "ACC. OTHERS": none
    OTHERS: none
    Others: none
    "MISC.": none
    TRANSDUCER: none
    "Certs Req": none
    "Special Req": none
    "Customer Spec": none

  # 표준 구역에서 나올 수 있는 필드. 여기 없는 필드는 그 구역에서 매핑하지 않는다.
  #
  # 좁게 잡으면 맞던 것이 미추출로 바뀐다. 실물 블록 안에 실제로 들어 있는
  # 항목을 보고 정했다 — 예를 들어 19FV077 의 `Valve Body Assembly` 는 바디
  # 어셈블리라면서 트림 재질(Plug Matl · Stem Matl · Seat Ring Matl)까지 담는다.
  fields:
    # general 과 service 는 허용 목록을 같이 쓴다. 문서 위쪽의 식별·공정 정보가
    # 한 덩어리이고, 회전 이름표가 블록 중앙에 서기 때문에 둘 사이 경계가 ±10pt
    # 흔들린다(52PV014 에서 `Flow Rate`·`Inlet Pressure` 가 GENERAL 로 넘어갔다).
    # 우리가 가르려는 것은 부품(본체·트림·액추에이터·포지셔너)이지 이 둘이 아니다.
    general: &document_level
      - engineering_tag_no
      - equipment_full_description
      - type_name
      - manufacturer
      - model_no
      - fluid_name
      - fluid_state
      - normal_flow_rate
      - normal_pressure
      - normal_temperature
      - specific_gravity
      - viscosity
      - required_cv
      - rated_cv

    service: *document_level

    body:
      - manufacturer
      - model_no
      - valve_body_size
      - valve_body_rating
      - valve_body_type
      - valve_body_material
      - valve_leakage_class
      - characteristic
      - rated_cv
      # 바디 블록이 트림 재질까지 담는 양식(19FV077)이 있다
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    trim:
      - characteristic
      - rated_cv
      - valve_leakage_class
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    material:
      - valve_body_material
      - valve_plug_material
      - valve_cage_material
      - valve_seat_material
      - valve_stem_material

    actuator:
      - actuator_type
      - actuator_fail_action

    positioner:
      - positioner_manufacturer
      - positioner_model_no

    none: []

# ── 복합 라벨 분해 ─────────────────────────────────────────────
# 라벨 하나가 표준 필드 여러 개를 덮는 칸. 벤더 양식에서 흔하다.
# 1:1 유사표현 사전으로는 풀 수 없어 별도 규칙으로 쪼갠다.
#
# 형식 두 가지
#   separator : 라벨과 값을 같은 구분자로 쪼개 순서대로 짝짓는다.
#               fields 의 null 은 "대응 표준 필드 없음 → 버림".
#               조각 수가 fields 수와 다르면 쪼개지 않고 미매핑으로 남긴다.
#   pattern   : 값에 정규식을 걸고 named group 이름을 field key 로 쓴다.
#
# 스키마에 아직 없는 field key 를 적어도 된다. 그 조각은 미매핑으로 남고,
# 필드가 추가되는 순간 규칙 수정 없이 자동으로 붙는다.
composite_labels:

  - label: "Size/Pressure Class/Body Form"
    separator: "/"
    fields: [valve_body_size, valve_body_rating, null]
    note: |
      Fisher·Samwoo 계열 텍스트 PDF.
      세 번째 조각은 대응 필드 없음 — Body Form 은 주조·단조 구분(Cast/Forged)이지
      밸브 형식이 아니다. 19FV077 값이 "2.00 / CL 1500 / Cast" 인데 골든셋 정답은
      Globe 이고, 그 값은 같은 문서의 "Valve Model / Body Type" 줄에 있다.
      2026-08-25 골든셋 대조에서 정정.

  # ── 포지셔너 — 모델과 제조사를 한 칸에 적는 양식 ──────────────────
  # ⚠️ 복합 라벨 규칙은 구역을 보지 않는다. 같은 라벨이 솔레노이드·리밋스위치
  #    블록에도 있지만 그쪽은 값이 비어 있어 규칙이 발동하지 않는다(실물 확인).
  - label: "Model No. / Mfr."
    separator: ","
    fields: [positioner_model_no, positioner_manufacturer]
    note: |
      52PV014 값 예: "I/P5000, SMC" — 모델, 제조사 순.
      값이 한 조각뿐이면(10FV079 "AVP-302") 규칙이 발동하지 않고,
      같은 라벨이 POSITIONER MODEL NO. 의 구역 한정 유사표현으로 잡힌다.

  # ── Flowserve·Valtek 계열 (19FV077 · 11FV502) ────────────────────
  # 이 양식은 한 줄에 부품 재질과 표면처리를 함께 적는다.
  # 값은 "/" 로 나뉘고 앞 조각만 우리 필드에 해당한다.
  - label: "Act. Type/Matl"
    separator: "/"
    fields: [actuator_type, null]
    note: "값 예: 'VL Cylinder / Aluminum' — 뒤는 액추에이터 재질(우리 필드 아님)"

  - label: "Max Shutoff / Shutoff Class"
    separator: "/"
    fields: [null, valve_leakage_class]
    note: "값 예: '27.000 kg/cm² / Class V' — 앞은 최대 차압(우리 필드 아님)"

  - label: "Plug Matl / Facing"
    separator: "/"
    fields: [valve_plug_material, null]
    note: "값 예: '410 SS HT /' — 뒤는 표면처리"

  - label: "Stem Matl / Facing"
    separator: "/"
    fields: [valve_stem_material, null]

  - label: "Seat Ring Matl / Facing"
    separator: "/"
    fields: [valve_seat_material, null]

  - label: "Seat Ring Mtl/ Facing|Treatment"
    separator: "/"
    fields: [valve_seat_material, null]

  - label: "Seat Retainer Mtl/ Facing|Treatment"
    separator: "/"
    fields: [valve_cage_material, null]
    note: "Valtek 은 케이지를 Seat Retainer 라고 부른다 (킷 라벨링에서 확인)"

  - label: "Valve Model / Body Type"
    separator: "/"
    fields: [model_no, valve_body_type, null]
    note: |
      19FV077 — 라벨은 두 조각인데 값은 "Mark One / Globe / Standard" 로 세 조각이다.
      세 번째는 트림 구조라 대응 필드가 없다.

  - label: "Model / Body Type / Trim Type"
    separator: "/"
    fields: [model_no, valve_body_type, null]
    note: |
      Trim Type("Standard")은 트림 구조 표기이지 유량 특성이 아니다.
      CHARACTERISTIC 은 같은 문서의 "Trim # - Cv / Characteristic"("Linear")에서 온다.
      2026-08-24 골든셋 대조에서 확인 — 대응 필드 없음으로 정정.

  - label: "Max Shutoff / Shutoff Class"
    separator: "/"
    fields: [null, valve_leakage_class]
    note: "앞 조각(최대 차압)은 마스터 스키마에 대응 필드 없음"

  - label: "Fail/Air-To"
    separator: "/"
    fields: [actuator_fail_action, null]
    note: |
      Fail 표기와 Air-To 표기를 한 칸에 같이 준다. 예) "Close / Open"
      앞 조각이 Fail 값이므로 그대로 쓴다. 뒤 조각은 역전 규칙 교차검증에 쓸 수 있다.
      (Fail=Close 이면 Air-To=Open 이어야 정합)

  - label: "Design Press./Temp."
    separator: "/"
    fields: [null, null]
    note: "설계 조건. 마스터 스키마는 Max/Normal/Min 만 있어 대응 필드 없음 — 버림"

  - label: "Process Fluid"
    separator: "/"
    fields: [fluid_name, fluid_state]
    note: "Flowserve 계열. 값이 'LS AR / LIQUID' 형태로 유체명과 상태를 묶어 준다"

  - label: "Size and Type"
    pattern: '^\s*(?P<valve_body_size>[\d\-/½¼¾\.]+\s*")\s*,?\s*(?P<model_no>\S.*?)\s*$'
    note: |
      Fisher 1986 수기 양식. 값이 '1" 1250R-GL' / '2", 657-EZ' 형태로
      바디 사이즈와 모델번호를 한 칸에 묶어 준다.
      유사표현으로 넣으면 두 필드가 같은 표기를 다투므로 복합 규칙으로 둔다.

  - label: "Body Matl / Bonnet Matl"
    separator: "/"
    fields: [valve_body_material, null]
    note: "Flowserve·Valtek 계열. 뒤 조각(보닛 재질)은 마스터 스키마에 대응 필드 없음"

  - label: "Trim # - Cv / Characteristic"
    separator: "/"
    fields: [null, characteristic]
    note: |
      앞 조각은 "2.62  Cv:116" 형태로 트림번호와 정격 Cv 가 묶여 있다.
      Cv 필드 이름이 확정되면(RATED CV / RATED CV MAX) pattern 규칙으로 바꿔 앞 조각도 살릴 것.

  - label: "Body Model(Type)"
    pattern: '^(?P<model_no>[^(]+)\((?P<valve_body_type>[^)]+)\)$'
    note: "한국어 리트로핏 점검서. 값이 '657-ED(GLOBE)' 형태로 모델과 바디 형상을 묶어 준다"

# ── To-be (MVP 범위 외) ───────────────────────────────────────
unit_conversion:
  enabled: false
  note: "MVP 는 원문 표기 보존. 향후 분류별 단위를 고정하고 변환까지 구현"

enum_allowed_values:
  enabled: false
  note: "범주형 허용값 리스트. MVP 범위 외"
