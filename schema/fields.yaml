# 컨트롤밸브 기준정보 필드 정의서
#
# 이 파일은 readme/output_sample.xlsx 에서 자동 생성됨.
#   재생성: python tools/gen_schema.py
# 직접 편집하지 말고 엑셀을 수정한 뒤 재생성할 것.
#
# safety : safety(안전) / identity(식별) / normal(일반)
#          safety·identity 는 확신도와 무관하게 사람 확인이 필요한 필드
# source : document(문서 추출) / derived(규칙 파생) / system(시스템)
#          MVP 에서는 전부 document — 스마트 계장 파생 필드는 범위 외
# mvp    : MVP 수직 슬라이스 대상 여부

