# 검토자에게 보여주는 자연어 판단 기준. 결정론적 규칙은 rules.yaml 에 둔다.
# 여러 줄은 반드시 `|` 블록으로 쓴다 — 이스케이프된 한 줄이 되면
# 사람이 못 읽고, 읽히는 것이 이 파일의 기능이다.
meta:
  version: 0.3.0
  note: |-
    예외가 떴을 때 검토자에게 보여주는 자연어 판단 기준. 결정론적 규칙은
    rules.yaml 에 둔다.

    2026-08-25 서경빈 — 스키마 표류로 죽어 있던 지침 3건 정리
      (rated_cv_max→rated_cv · rated_cv_normal→required_cv · positioner_type 은
      필드 삭제) + 실물에서 나온 판단 기준 12필드 추가.

    2026-08-26 서경빈 — **28필드 전부 지침을 갖는다.** 빠져 있던 8건 추가
      (characteristic · valve_plug_material · valve_seat_material ·
      valve_stem_material · specific_gravity · fluid_name · viscosity ·
      equipment_full_description) — 그중 셋이 필수 필드였다.
      공정 조건 3건은 규칙 7-1(Normal 열이 없는 양식)과 열 표기 검증법을 반영해 보강.
      근거는 골든셋 35건 실측이다 — 값 분포와 함정을 세어 적었다.
general:
  by: 이종수
  text: |-
    모르는 값을 만들지 않는다. 문서에 근거가 없으면 N/A 로 두고 비고에 왜 없는지 적는다.
    추정값이 마스터DB 에 들어가면 이 과제가 없애려는 문제를 그대로 재생산한다.

    확인필요(노란 점선)는 "AI 가 여기라고 생각하지만 확신이 없다"는 뜻이다.
    지면의 해당 위치를 눈으로 보고, 값이 맞으면 [확인], 다르면 직접 입력한다.
  updated: '2026-08-23'
fields:
  positioner_model_no:
    by: 이종수
    text: |-
      포지셔너가 달리지 않는 밸브가 있다 — 자기구동 레귤레이터, 온·오프 밸브 등.
      문서에 포지셔너 항목이 아예 없으면 값을 만들지 말고 N/A 로 확인한다.
      필수 필드이므로 [N/A 확인] 을 누르는 것이 정상 절차다. 필수에서 자동으로
      빼주지 않는다 — 태그 접두어(PCV/TCV/FCV)로 판단하면 포지셔너가 실제로
      누락된 일반 제어밸브까지 조용히 통과한다.
    updated: '2026-08-23'
  actuator_fail_action:
    by: 이종수
    text: |-
      이 필드는 안전 필드다. 정상추출로 떠도 확인 버튼이 나오고, 눈으로 한 번 봐야 넘어간다.

      데이터시트는 공기 작용 방향으로 적고(AIR TO OPEN / ATO), 우리 표준값은 공기가
      끊겼을 때의 거동이다(FAIL CLOSE). 둘은 서로 반대다. 화면의 [이력] 에서
      원문과 변환 과정을 확인하고, 원문이 ATO 인데 표준값이 FAIL OPEN 으로 되어
      있으면 그건 오류다.

      ACTUATOR TYPE 은 추출 대상이 아니므로(구동부는 FAIL POSITION 만) 자동 교차검증이
      돌지 않는다. 그만큼 사람 확인이 유일한 안전장치다.
    updated: '2026-08-23'
  valve_body_material:
    by: 이종수
    text: |-
      바디 재질과 트림 재질이 한 칸에 함께 적힌 양식이 많다 (예: WCB / 316SST).
      앞이 바디, 뒤가 트림인 경우가 일반적이지만 양식마다 다르므로 지면을 보고
      바디 재질만 남긴다. 트림 재질을 담을 필드는 아직 없다.
    updated: '2026-08-23'
  manufacturer:
    by: 이종수
    updated: '2026-08-24'
    text: |-
      하단 회사명이 제조사가 아닐 수 있다. Retrofit·Repair 문서에서는 그것이
      시공 업체다.

      실례 — 10FV011 의 2003년 Retrofit 사양서는 하단에 VALSTONE SERVICE, CO.
      가 찍혀 있지만 밸브 제조사는 Fisher 다. 근거는 표가 아니라 Note 의
      한국어 문장이다: "현재 Valve의 Body 사용 (Model : ED, FISHER)".
      포지셔너 제조사(Masoneilan)도 같은 Note 에서 나온다.

      반대 사례도 있다 — 10FV079 Metso 데이터시트는 하단 "Metso Korea Co., Ltd."
      가 실제 제조사다. 즉 하단 회사명은 문서 성격에 따라 맞기도 하고 틀리기도
      한다. 문서 제목·Project 란에 RETROFIT / REPAIR 가 있으면 하단을 믿지 말고
      Note 를 읽는다.

      판단이 서지 않으면 N/A 로 두고 비고에 하단 업체명을 적어둔다. 시공사를
      제조사로 넣으면 정비 발주에서 엉뚱한 벤더를 찾게 된다.
  engineering_tag_no:
    by: 이종수
    updated: '2026-08-24'
    text: |-
      ■ 명명 규칙

          Area - 설비종류 - 일련번호        A10-FV-001 · B10-PV-1631A
           └ 문자+숫자   └ FV·PV·LV…    └ 숫자(+접미 A/B)

      Area 는 문자와 숫자를 합친 것이다(A10, B19). 앞의 문자가 공장이고
      **없으면 A 가 생략된 것**이다 — 1공장이 최초 공장이라 지을 때는 공장
      구분이 필요 없었고, 2공장이 생기면서 B 를 붙이기 시작했다. 문서에
      `10-FV-012` 라고 적혀 있어도 정식 표기는 `A10-FV-012` 다.

      ■ 적을 값

      **문서에 적힌 그대로 쓴다.** `10-FV-011` 이라고 적혀 있으면 그대로 적고,
      없는 A 를 만들어 넣지 않는다. 마스터DB 에 정식 표기로 저장하는 것은
      to-be 이고, 지금은 써 있는 대로 읽는 것이 중요하다. 구역 대조는
      시스템이 내부 키(A10FV012)로 알아서 한다.

      구역이 다르면 다른 설비다 — `10-FV-012`(A10 구역)와 `B10-FV-012`
      (B10 구역)는 완전히 다른 밸브다. 앞 글자를 빠뜨리면 두 설비가 하나로
      합쳐진다.

      ■ 사양표 한 장이 여러 태그를 담는 경우

      같은 사양의 밸브를 한꺼번에 Retrofit 하면 한 장으로 갈음한다. 10FV011 의
      1페이지는 Tag No. 가 `10-FV-011 / 012 / 013 / 014`, Quantity 4 다.
      이 파일의 답은 그중 `10-FV-011` 하나다.

      값은 파일명 태그로 확정하고, 원문라벨에 "페이지 Tag No. 목록에 포함"
      을 적는다. 페이지에 적힌 문자열 전체를 그대로 넣지 않는다.

      선택된 페이지의 태그 목록에 파일명 태그가 아예 없으면 그 페이지가 이
      자산의 것이 아닐 수 있다 — 확인필요로 남기고 사람이 본다.

      ■ 파일명에 태그가 없는 문서

      `070055_REV0.pdf` 처럼 파일명이 관리번호뿐인 문서가 있다. 이때는 문서
      안의 Valve Tag 칸을 읽는다(이 파일은 `B10-PV-1631A`).

      ■ 예외 — B19 구역

      2공장(B)은 미국에서 설비를 그대로 들여왔다. 그래서 자체 명명 규칙이
      아니라 원래 공장의 태그를 쓴다. 자체 규칙으로 바꾸면 기존 도면과
      호환되지 않으므로 Area 표시만 앞에 붙였다 — `B19V10` 은 B19 구역의
      `V10` 설비다(문서 안 태그도 그냥 `V10`). 공장 전체에 몇 안 되는
      예외이므로 규칙에 맞추려 하지 말고 문서에 적힌 대로 적는다.
  model_no:
    by: 이종수
    updated: '2026-08-24'
    text: |-
      Retrofit 을 거친 밸브는 모델명이 바뀌어 있다. 같은 파일 안에 옛 사양서가
      함께 철되어 있으므로 어느 쪽을 읽었는지가 답을 가른다.

      실례 — 10FV011: 1986년 원본은 657-ED, 2003년 Retrofit 후는 667-ED 다.
      액추에이터를 657(size 40) → 667(size 45) 로 교체했기 때문이다. 본체(ED)는
      그대로 쓰고 액추에이터만 바꿨다.

      본체와 액추에이터를 붙여 쓴 표기(667-EZ, GU-VDR, 667-ED)를 그대로 적는다.
      앞자리가 액추에이터, 뒷자리가 본체다. 쪼개지 않는다.

      같은 파일의 준공검사보고서(REPAIR REPORT)에 사양 블록이 있으면 대조에
      쓸 수 있다. 단 거기에도 오타가 있다 — 10FV011 보고서는 87-ED 로 적혀 있다.
      숫자가 어긋나면 사양서 쪽을 우선하고 비고에 남긴다.
  rated_cv:
    by: 이종수
    text: |-
      밸브의 정격 Cv 다. 데이터시트에 없는 경우는 거의 없으므로, N/A 로 떴다면
      먼저 지면을 다시 본다. Cv · Kv · Flow Coefficient · 정격유량계수 등으로
      적혀 있을 수 있다. 공정조건으로 계산해 채우는 값이 아니다 — 계산값은
      운전조건에서 필요한 Cv 이고, 그건 RATED CV NORMAL 이다.
    updated: '2026-08-23'
  required_cv:
    by: 이종수
    text: |-
      운전조건에서 필요한 Cv 다. 문서에 없으면 [Cv 계산] 으로 제안값을 만들 수 있다.
      차압(ΔP)은 기준정보 항목이 아니므로 그 자리에서 사람이 넣는다.
      계산해서 넣은 값은 '사람 입력' 으로 기록되고 변환 이력에 계산식이 남는다.
    updated: '2026-08-23'
  valve_body_rating:
    text: |-
      등급에는 반드시 숫자가 있다 — `ANSI CLASS 300` · `600#` · `CL 1500` 이 모두 같은 뜻이다.
      표기가 달라도 숫자가 같으면 같은 값이다.

      ■ 함정
      `End Connection` 칸을 등급으로 오해하기 쉽다. 그 칸에는 `RF FLANGED` 처럼
      연결 형식이 들어 있을 때가 있다(15LV015). 숫자가 없으면 등급이 아니다.
    by: 서경빈
    updated: '2026-08-25'
  valve_body_size:
    text: |-
      `4"` · `4 IN` · `1-1/2in` · `IN DIA. 200 mm` 가 모두 정상 표기다. 단위를 고치지 말고
      문서에 적힌 그대로 둔다.

      ■ 함정
      `Size and Type` 처럼 한 칸에 크기와 모델이 함께 적힌 양식이 있다
      (`1" 1250R-GL`). 이때 크기는 앞부분이고, 뒤는 MODEL NO. 다.
      액추에이터 묶음에도 `Size` 칸이 있다 — 그건 액추에이터 크기이지 밸브 크기가 아니다.
    by: 서경빈
    updated: '2026-08-25'
  type_name:
    text: |-
      문서에 이 항목이 있는 경우는 거의 없다. 태그 접두에서 도출한다 —
      `FV`→Flow · `TV`→Temperature · `PV`→Pressure · `LV`→Level Control Valve.

      ■ 함정
      태그와 실물이 다를 수 있다. `11-FV-039` 는 태그가 FV 인데 내용은
      **댐퍼 액추에이터 정비보고서**였다(2026-08-25). 문서가 무엇인지 먼저 보고,
      태그 규칙과 다르면 문서 쪽을 따르고 비고에 적는다.
    by: 서경빈
    updated: '2026-08-25'
  fluid_state:
    text: |-
      문서에 항목이 없으면 FLUID NAME 에서 유추한다 (`WATER`→LIQUID · `Fuel Gas`→GAS).
      유추한 것이면 비고에 남긴다.

      ■ 함정
      `Fluid` 라는 한 칸에 유체명과 상태가 함께 적힌 양식이 있다 (`LS AR / LIQUID`).
      그때는 뒷부분이 상태다.
    by: 서경빈
    updated: '2026-08-25'
  valve_body_type:
    text: |-
      밸브의 형식이다 — Globe · Butterfly · Ball · Angle 등.

      ■ 함정
      `Body Form` 칸은 형식이 아니다. 주조·단조 구분(`Cast`)이 들어간다.
      19FV077 은 한 줄에 `Size/Pressure Class/Body Form = 2.00 / CL 1500 / Cast` 이고,
      형식(`Globe`)은 다른 줄의 `Valve Model / Body Type` 에 있다 (2026-08-25 확인).
    by: 서경빈
    updated: '2026-08-25'
  valve_leakage_class:
    text: |-
      `CLASS 4` 와 `CLASS IV` 는 같은 값이다. 로마자와 아라비아 숫자를 섞어 쓴다.
      `ANSI Class II` · `FCI 70-2 Class IV` 같은 규격 접두는 붙어 있어도 된다.
    by: 서경빈
    updated: '2026-08-25'
  valve_cage_material:
    text: |-
      벤더마다 케이지를 다르게 부른다 — `Cage` · `Retainer` · `Seat Retainer` ·
      `Cage and/or Bushing`.

      ■ 함정
      **`Guide`(가이드 부싱)는 케이지가 아니다.** 10FV079 는 두 칸이 따로 있고
      값도 다르다(`Guide Material = SOLID STELLITE` vs 케이지 `316 SST`).
      가이드 값을 케이지에 넣지 않는다 (2026-08-25 실측에서 실제로 틀렸던 건).
    by: 서경빈
    updated: '2026-08-25'
  positioner_manufacturer:
    text: |-
      데이터시트에 포지셔너 제조사 항목이 아예 없는 경우가 많다. 모델명으로 유추할 수는
      있지만(`3582G`→Fisher · `DVC6200`→Fisher · `YT-1200`→YTC) **문서에 없는 값을
      만드는 것**이므로 근거를 비고에 남긴다.

      ■ 함정
      `Maker` · `Model No.` 같은 이름은 밸브 본체 칸에도 있다. 그 값이 포지셔너 묶음
      안에 있는지 눈으로 확인한다. 포지셔너가 없는 밸브면 N/A 다.
    by: 서경빈
    updated: '2026-08-25'
  actuator_type:
    text: |-
      `DIAPHRAGM` · `PISTON` · `VL Cylinder` 처럼 구동 방식을 적는다. 문서에 항목이
      없으면 모델명에서 유추할 수 있다 (`A200 SR` 의 SR = Spring Return).
      유추면 비고에 남긴다.
    by: 서경빈
    updated: '2026-08-25'
  normal_flow_rate:
    text: |-
      공정 조건 유량이다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.

      ■ 함정 ① NOR 열이 비어 있으면 MAX 를 대신 쓰지 않는다
      N/A 로 두고 비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로
      둔다 (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

      ■ 함정 ② `Normal` 이라는 단어가 없는 표가 있다
      벤더마다 운전 조건 열을 다르게 부른다 — `Cond 1|Cond 2|…` · `Case 1|…` ·
      `Operating` · `Rated`. 이때는 맨 왼쪽 운전 조건 열을 읽는다.
      `Design` · `Shutoff` · `Max Allowable` 은 운전 조건이 아니다 — 설계 한계다.

      ■ 어느 열에서 읽었는지 원문라벨에 적혀 있다
      `Temperature (Cond 1)` 처럼 괄호로 붙는다. **그 한 줄로 검증한다** —
      지면의 열 제목과 괄호 안이 같은지만 보면 된다.

      ■ 왜 이 필드를 특히 봐야 하나
      처음 보는 문서 5건 측정에서 **가장 많이 틀린 원인이 열 선택**이었다(30건 중 8건).
      공정 조건 4필드가 격차 상위를 전부 차지했다. 자동 수단이 못 잡는 종류다.
    by: 서경빈
    updated: '2026-08-25'
  normal_pressure:
    text: |-
      공정 조건 압력이다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.

      ■ 함정 ① NOR 열이 비어 있으면 MAX 를 대신 쓰지 않는다
      N/A 로 두고 비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로
      둔다 (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

      ■ 함정 ② `Normal` 이라는 단어가 없는 표가 있다
      벤더마다 운전 조건 열을 다르게 부른다 — `Cond 1|Cond 2|…` · `Case 1|…` ·
      `Operating` · `Rated`. 이때는 맨 왼쪽 운전 조건 열을 읽는다.
      `Design` · `Shutoff` · `Max Allowable` 은 운전 조건이 아니다 — 설계 한계다.

      ■ 어느 열에서 읽었는지 원문라벨에 적혀 있다
      `Temperature (Cond 1)` 처럼 괄호로 붙는다. **그 한 줄로 검증한다** —
      지면의 열 제목과 괄호 안이 같은지만 보면 된다.

      ■ 왜 이 필드를 특히 봐야 하나
      처음 보는 문서 5건 측정에서 **가장 많이 틀린 원인이 열 선택**이었다(30건 중 8건).
      공정 조건 4필드가 격차 상위를 전부 차지했다. 자동 수단이 못 잡는 종류다.
    by: 서경빈
    updated: '2026-08-25'
  normal_temperature:
    text: |-
      공정 조건 온도다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.

      ■ 함정 ① NOR 열이 비어 있으면 MAX 를 대신 쓰지 않는다
      N/A 로 두고 비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로
      둔다 (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

      ■ 함정 ② `Normal` 이라는 단어가 없는 표가 있다
      벤더마다 운전 조건 열을 다르게 부른다 — `Cond 1|Cond 2|…` · `Case 1|…` ·
      `Operating` · `Rated`. 이때는 맨 왼쪽 운전 조건 열을 읽는다.
      `Design` · `Shutoff` · `Max Allowable` 은 운전 조건이 아니다 — 설계 한계다.

      ■ 어느 열에서 읽었는지 원문라벨에 적혀 있다
      `Temperature (Cond 1)` 처럼 괄호로 붙는다. **그 한 줄로 검증한다** —
      지면의 열 제목과 괄호 안이 같은지만 보면 된다.

      ■ 왜 이 필드를 특히 봐야 하나
      처음 보는 문서 5건 측정에서 **가장 많이 틀린 원인이 열 선택**이었다(30건 중 8건).
      공정 조건 4필드가 격차 상위를 전부 차지했다. 자동 수단이 못 잡는 종류다.
    by: 서경빈
    updated: '2026-08-25'
  characteristic:
    text: |-
      유량 특성이다. 밸브가 열리는 정도에 따라 유량이 어떻게 늘어나는지를 말한다.
      표준값은 EQUAL PERCENTAGE · LINEAR · QUICK OPENING · MODIFIED PERCENTAGE 다.
      골든셋 35건 실측 — EQUAL PERCENTAGE 21 · LINEAR 9 · N/A 3 · 나머지 각 1.

      ■ 함정 ① 표기가 갈린다 — 원문이 EQ 계열이면 정상이다
      문서는 `EQ%` · `EQ - %` · `Equal %` 로 줄여 적는다. 표기 사전이 펴 주므로
      화면에는 `EQ% → EQUAL PERCENTAGE` 로 둘 다 보인다. 실측 10칸이 이 경우다.

      ■ 함정 ② `Standard` 는 이 필드가 아니다
      `Model / Body Type / Trim Type` 칸의 `Standard` 는 **트림 구조** 표기이고
      유량 특성이 아니다. 특성은 같은 문서의 `Trim # - Cv / Characteristic` 줄에
      있다(2026-08-24 골든셋 대조에서 확인). 값이 `Standard` 면 틀린 칸이다.

      ■ 필수 필드다
      값이 없으면 [N/A 확인] 을 눌러야 넘어간다. 온·오프 밸브는 특성 표기가
      없을 수 있다 — 그때는 N/A 가 정상이다.
    by: 서경빈
    updated: '2026-08-26'
  valve_plug_material:
    text: |-
      플러그(유량을 막는 부품) 재질이다. 필수 필드다.

      ■ 함정 ① `/` 와 `+` 는 두 재질을 뜻한다 — 앞쪽만 남기지 않는다
      `316 SST / CoCr-A` 는 모재 316 스테인리스에 CoCr-A(스텔라이트 계열)를
      표면경화한 것이다. `316 SST + STELLITE` 도 같은 뜻이다. 앞쪽만 남기면
      표면경화 사양이 사라진다 — 골든셋 정답도 두 재질을 함께 적는다(3건).

      ■ 함정 ② 한 글자가 다른 재질이다 — 화면이 고쳐 주지 않는다
      `316 SS` · `316 SST` · `316L SST` 는 서로 다른 표기이고 `316L` 은 저탄소
      강종이다. `CS`(탄소강)와 `C5`(크롬몰리강)도 한 글자 차이다. 재질 필드는
      **자동 교정 대상이 아니다**(팀 결정) — 어휘 밖으로 떠도 지면과 글자를
      맞춰 보고 그대로 확인한다.

      ■ 값이 없을 때
      정비보고서는 교체한 부품만 적어 플러그 재질이 없는 경우가 있다.
      N/A + 사유로 둔다. 억지로 시트 재질을 옮겨 적지 않는다.
    by: 서경빈
    updated: '2026-08-26'
  valve_seat_material:
    text: |-
      시트링(플러그가 닿아 유로를 막는 면) 재질이다. 필수 필드다.

      ■ 함정 ① 금속이 아닐 수 있다
      `NBR` 처럼 고무 시트가 있다(소프트시트, 실측 2건). 금속 재질표에 없다고
      오류가 아니다.

      ■ 함정 ② `/` `+` `CAST` 를 지우지 않는다
      `SUS 316/CoCr-A` · `316 SST + STELLITE` · `316 SS + STF` · `CAST CoCr-A`.
      앞쪽만 남기면 표면경화·주조 구분이 사라진다.

      ■ 함정 ③ 플러그 재질과 값이 같아도 정상이다
      같은 재질을 쓰는 양식이 있다 — 11FV048 은 플러그·시트가 모두
      `316 SST / CoCr-A` 다. 값이 같다고 한쪽을 복사한 것으로 보지 않는다.
      다만 원문라벨이 `Plug Material` · `Seat Ring Material` 로 서로 다른지는
      확인한다. 같은 라벨에서 왔다면 그것은 오집이다.
    by: 서경빈
    updated: '2026-08-26'
  valve_stem_material:
    text: |-
      스템(플러그를 밀어 올리는 축) 재질이다.

      ■ 함정 ① `Std.` 가 가장 흔하다 — 재질명이 아니다
      골든셋 35건 중 **13건이 `Std.`** 다. 양식이 "표준품" 이라고만 적고 재질을
      밝히지 않는다. 그대로 둔다 — 재질을 알아야 하면 벤더 표준 사양서를 봐야
      한다는 뜻이고, 그 사실 자체가 정보다. 임의로 `SUS316` 을 넣지 않는다.

      ■ 함정 ② 괄호는 치수다
      `SUS316            (1/2")` 의 `(1/2")` 는 스템 지름이지 재질이 아니다.
      복합 규칙이 떼어 값에서는 빠지고 비고에 남는다(2026-08-26).
      비고에 `note_stem_size=1/2"` 가 보이면 정상 동작이다.
    by: 서경빈
    updated: '2026-08-26'
  specific_gravity:
    text: |-
      비중이다. 물을 1 로 본 상대값이라 **보통 단위가 없다.**

      ■ 함정 ① 단위가 붙어 있으면 비중이 아니다
      `4.95 kg/m3` 는 **밀도**다(실측 2건). 비중 칸에 밀도를 적은 양식이므로
      숫자만 떼어 옮기지 않는다 — 단위를 살려 두고 사람이 판단한다.
      비중과 밀도는 다른 양이고, 물 기준으로 나누지 않은 값을 비중 열에 넣으면
      1000배 틀린다.

      ■ 함정 ② 기체는 분자량으로 적는 양식이 있다
      유사표현에 `SG-MW` 가 있다 — 한 칸에 비중과 분자량을 같이 주는 양식이다.
      기체 유체에서 값이 2 보다 크면 분자량일 가능성을 먼저 본다.

      ■ 함정 ③ 앞자리 0 은 우리가 붙인다
      문서가 `.933` 으로 적어도 마스터에는 `0.933` 으로 들어간다(2026-08-26 규칙).
      값이 바뀐 것이 아니다 — 마스터 열에서 조회·정렬이 깨지지 않게 하는 것이다.

      ■ 함정 ④ 열 선택
      공정 조건 표 안에 있으면 MIN/NOR/MAX 문제가 그대로 적용된다. 처음 보는
      문서에서 이 필드 정확도가 76% → 40% 로 떨어졌고 원인이 열 선택이었다.
    by: 서경빈
    updated: '2026-08-26'
  fluid_name:
    text: |-
      유체명이다.

      ■ 함정 ① 상태와 한 칸에 있다
      `Process Fluid` 칸이 `LS AR / LIQUID` 처럼 유체명과 상태를 묶어 준다
      (Flowserve 계열). 복합 규칙이 FLUID NAME · FLUID STATE 로 나눈다.
      값에 `LIQUID` · `GAS` 가 남아 있으면 나뉘지 않은 것이다.

      ■ 함정 ② 거의 매번 새 값이다 — 어휘로 걸러지지 않는다
      골든셋 31건 중 고유값이 24개다. `LS AR`(저황 상압잔사유) · `HS CRUDE` ·
      `M.P. STEAM`(중압 스팀) 처럼 공정 약어가 대부분이다. **어휘 밖이라는 표시가
      뜨지 않으니 지면과 글자를 직접 맞춰 본다.** 처음 보는 문서에서 `QUENCH` 를
      `SUCTION` 으로 잘못 읽은 사례가 있다 — 자동으로는 걸리지 않았다.

      ■ 축약하지 않는다
      약어를 풀어 쓰거나 영문으로 바꾸지 않는다. 마스터에서 같은 유체를 묶는
      기준이 흔들린다.
    by: 서경빈
    updated: '2026-08-26'
  viscosity:
    text: |-
      점도다. 골든셋 35건 중 **28건이 N/A** 다 — 점도 칸이 없는 양식이 많다.

      ■ 함정 ① 없는 것이 정상이다
      값이 안 나와도 추출 실패가 아니다. 문서에 칸이 없으면 N/A + 사유로 둔다.
      이 필드가 비었다고 다른 표에서 찾아 채우지 않는다.

      ■ 함정 ② 구역 이름표가 값에 섞이는 경우
      정답지에 `Process Data For Control Valve Selection, 1.705` 로 적힌 행이 있다
      (2026-08-26 발견). 앞부분은 **구역 이름표**이고 값은 `1.705 cP` 다.
      값 칸에 문장이 들어와 있으면 구역명이 섞인 것이므로 숫자와 단위만 남긴다.

      ■ 단위
      `cP`(센티포아즈)가 표준이다. `0 cP` 도 문서에 그렇게 적혀 있으면 그대로 둔다.
    by: 서경빈
    updated: '2026-08-26'
  equipment_full_description:
    text: |-
      설비 전체 명칭 — 이 밸브가 무슨 일을 하는지 적은 서비스 설명이다.

      ■ 함정 ① 대부분 없다
      골든셋 35건 중 **31건이 N/A** 다. 있는 양식은 제목줄이나 SERVICE 칸에
      문장으로 적는다 — `QUENCH GAS TO HC REACTOR RED No.1` 처럼 길다.

      ■ 함정 ② 축약하지 않고 그대로 옮긴다
      `HC NAPHTHA FEED TO FEED/EFFLO Ex CH. SHUTOFF` 처럼 슬래시·마침표가
      섞인다. 이 필드는 **사람이 나중에 밸브를 찾을 때 쓰는 단서**이므로
      길다고 줄이지 않는다.

      ■ 태그와 혼동하지 않는다
      `MS-1151 Inlet` 처럼 설비번호가 앞에 붙는 경우가 있다. ENGINEERING TAG NO.
      와 다른 필드다 — 태그는 밸브 자신의 번호이고 이쪽은 서비스 설명이다.
    by: 서경빈
    updated: '2026-08-26'
