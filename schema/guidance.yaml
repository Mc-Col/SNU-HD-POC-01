# 판단 지침 — 자연어 규칙
#
# 소유: 이종수 책임 · 서경빈 선임 (도메인 전문가 공동)
#
# rules.yaml 은 기계가 적용하는 결정론적 규칙이다. 이 파일은 그것으로 적을 수 없는
# 판단 기준을 사람 말로 적는 곳이다. 예외 항목(확인필요·N/A)이 뜨면 화면이 이 글을
# 그대로 보여준다 — 검토자가 매번 같은 판단을 다시 발명하지 않게 하는 것이 목적이다.
#
# 화면에서도 편집된다(HITL 의 [지침] 버튼). 그래서 rules.yaml 과 분리했다 —
# rules.yaml 은 주석이 많은 손 관리 파일이고, 기계가 덮어쓰면 주석이 사라진다.
#
# 손으로 편집해도 되고, 화면에서 적어도 된다. 형식만 지키면 된다:
#   fields:
#     <field_key>:
#       text: |
#         여러 줄로 자유롭게
#       by: "작성자"
#       updated: "YYYY-MM-DD"

meta:
  version: 0.2.0
  note: '예외 발생 시 검토자에게 보여주는 자연어 판단 기준. 결정론적 규칙은 rules.yaml 에 둔다. 2026-08-25 서경빈: 스키마 표류로 죽어
    있던 지침 3건 정리 (rated_cv_max→rated_cv · rated_cv_normal→required_cv · positioner_type 은 필드
    삭제) + 실물에서 나온 판단 기준 12필드 추가'
general:
  by: 이종수
  text: '모르는 값을 만들지 않는다. 문서에 근거가 없으면 N/A 로 두고 비고에 왜 없는지 적는다.

    추정값이 마스터DB 에 들어가면 이 과제가 없애려는 문제를 그대로 재생산한다.


    확인필요(노란 점선)는 "AI 가 여기라고 생각하지만 확신이 없다"는 뜻이다.

    지면의 해당 위치를 눈으로 보고, 값이 맞으면 [확인], 다르면 직접 입력한다.

    '
  updated: '2026-08-23'
fields:
  positioner_model_no:
    by: 이종수
    text: '포지셔너가 달리지 않는 밸브가 있다 — 자기구동 레귤레이터, 온·오프 밸브 등.

      문서에 포지셔너 항목이 아예 없으면 값을 만들지 말고 N/A 로 확인한다.

      필수 필드이므로 [N/A 확인] 을 누르는 것이 정상 절차다. 필수에서 자동으로

      빼주지 않는다 — 태그 접두어(PCV/TCV/FCV)로 판단하면 포지셔너가 실제로

      누락된 일반 제어밸브까지 조용히 통과한다.

      '
    updated: '2026-08-23'
  actuator_fail_action:
    by: 이종수
    text: '이 필드는 안전 필드다. 정상추출로 떠도 확인 버튼이 나오고, 눈으로 한 번 봐야 넘어간다.


      데이터시트는 공기 작용 방향으로 적고(AIR TO OPEN / ATO), 우리 표준값은 공기가

      끊겼을 때의 거동이다(FAIL CLOSE). 둘은 서로 반대다. 화면의 [이력] 에서

      원문과 변환 과정을 확인하고, 원문이 ATO 인데 표준값이 FAIL OPEN 으로 되어

      있으면 그건 오류다.


      ACTUATOR TYPE 은 추출 대상이 아니므로(구동부는 FAIL POSITION 만) 자동 교차검증이

      돌지 않는다. 그만큼 사람 확인이 유일한 안전장치다.

      '
    updated: '2026-08-23'
  valve_body_material:
    by: 이종수
    text: '바디 재질과 트림 재질이 한 칸에 함께 적힌 양식이 많다 (예: WCB / 316SST).

      앞이 바디, 뒤가 트림인 경우가 일반적이지만 양식마다 다르므로 지면을 보고

      바디 재질만 남긴다. 트림 재질을 담을 필드는 아직 없다.

      '
    updated: '2026-08-23'
  manufacturer:
    by: 이종수
    updated: '2026-08-24'
    text: '하단 회사명이 제조사가 아닐 수 있다. Retrofit·Repair 문서에서는 그것이

      시공 업체다.


      실례 — 10FV011 의 2003년 Retrofit 사양서는 하단에 VALSTONE SERVICE, CO.

      가 찍혀 있지만 밸브 제조사는 Fisher 다. 근거는 표가 아니라 Note 의

      한국어 문장이다: "현재 Valve의 Body 사용 (Model : ED, FISHER)".

      포지셔너 제조사(Masoneilan)도 같은 Note 에서 나온다.


      반대 사례도 있다 — 10FV079 Metso 데이터시트는 하단 "Metso Korea Co., Ltd."

      가 실제 제조사다. 즉 하단 회사명은 문서 성격에 따라 맞기도 하고 틀리기도

      한다. 문서 제목·Project 란에 RETROFIT / REPAIR 가 있으면 하단을 믿지 말고

      Note 를 읽는다.


      판단이 서지 않으면 N/A 로 두고 비고에 하단 업체명을 적어둔다. 시공사를

      제조사로 넣으면 정비 발주에서 엉뚱한 벤더를 찾게 된다.'
  engineering_tag_no:
    by: 이종수
    updated: '2026-08-24'
    text: "■ 명명 규칙\n\n    Area - 설비종류 - 일련번호        A10-FV-001 · B10-PV-1631A\n     └ 문자+숫자\
      \   └ FV·PV·LV…    └ 숫자(+접미 A/B)\n\nArea 는 문자와 숫자를 합친 것이다(A10, B19). 앞의 문자가 공장이고\n**없으면\
      \ A 가 생략된 것**이다 — 1공장이 최초 공장이라 지을 때는 공장\n구분이 필요 없었고, 2공장이 생기면서 B 를 붙이기 시작했다. 문서에\n`10-FV-012`\
      \ 라고 적혀 있어도 정식 표기는 `A10-FV-012` 다.\n\n■ 적을 값\n\n**문서에 적힌 그대로 쓴다.** `10-FV-011` 이라고 적혀\
      \ 있으면 그대로 적고,\n없는 A 를 만들어 넣지 않는다. 마스터DB 에 정식 표기로 저장하는 것은\nto-be 이고, 지금은 써 있는 대로 읽는 것이\
      \ 중요하다. 구역 대조는\n시스템이 내부 키(A10FV012)로 알아서 한다.\n\n구역이 다르면 다른 설비다 — `10-FV-012`(A10 구역)와\
      \ `B10-FV-012`\n(B10 구역)는 완전히 다른 밸브다. 앞 글자를 빠뜨리면 두 설비가 하나로\n합쳐진다.\n\n■ 사양표 한 장이 여러 태그를\
      \ 담는 경우\n\n같은 사양의 밸브를 한꺼번에 Retrofit 하면 한 장으로 갈음한다. 10FV011 의\n1페이지는 Tag No. 가 `10-FV-011\
      \ / 012 / 013 / 014`, Quantity 4 다.\n이 파일의 답은 그중 `10-FV-011` 하나다.\n\n값은 파일명 태그로 확정하고,\
      \ 원문라벨에 \"페이지 Tag No. 목록에 포함\"\n을 적는다. 페이지에 적힌 문자열 전체를 그대로 넣지 않는다.\n\n선택된 페이지의 태그 목록에\
      \ 파일명 태그가 아예 없으면 그 페이지가 이\n자산의 것이 아닐 수 있다 — 확인필요로 남기고 사람이 본다.\n\n■ 파일명에 태그가 없는 문서\n\n\
      `070055_REV0.pdf` 처럼 파일명이 관리번호뿐인 문서가 있다. 이때는 문서\n안의 Valve Tag 칸을 읽는다(이 파일은 `B10-PV-1631A`).\n\
      \n■ 예외 — B19 구역\n\n2공장(B)은 미국에서 설비를 그대로 들여왔다. 그래서 자체 명명 규칙이\n아니라 원래 공장의 태그를 쓴다. 자체 규칙으로\
      \ 바꾸면 기존 도면과\n호환되지 않으므로 Area 표시만 앞에 붙였다 — `B19V10` 은 B19 구역의\n`V10` 설비다(문서 안 태그도 그냥\
      \ `V10`). 공장 전체에 몇 안 되는\n예외이므로 규칙에 맞추려 하지 말고 문서에 적힌 대로 적는다."
  model_no:
    by: 이종수
    updated: '2026-08-24'
    text: 'Retrofit 을 거친 밸브는 모델명이 바뀌어 있다. 같은 파일 안에 옛 사양서가

      함께 철되어 있으므로 어느 쪽을 읽었는지가 답을 가른다.


      실례 — 10FV011: 1986년 원본은 657-ED, 2003년 Retrofit 후는 667-ED 다.

      액추에이터를 657(size 40) → 667(size 45) 로 교체했기 때문이다. 본체(ED)는

      그대로 쓰고 액추에이터만 바꿨다.


      본체와 액추에이터를 붙여 쓴 표기(667-EZ, GU-VDR, 667-ED)를 그대로 적는다.

      앞자리가 액추에이터, 뒷자리가 본체다. 쪼개지 않는다.


      같은 파일의 준공검사보고서(REPAIR REPORT)에 사양 블록이 있으면 대조에

      쓸 수 있다. 단 거기에도 오타가 있다 — 10FV011 보고서는 87-ED 로 적혀 있다.

      숫자가 어긋나면 사양서 쪽을 우선하고 비고에 남긴다.'
  rated_cv:
    by: 이종수
    text: '밸브의 정격 Cv 다. 데이터시트에 없는 경우는 거의 없으므로, N/A 로 떴다면

      먼저 지면을 다시 본다. Cv · Kv · Flow Coefficient · 정격유량계수 등으로

      적혀 있을 수 있다. 공정조건으로 계산해 채우는 값이 아니다 — 계산값은

      운전조건에서 필요한 Cv 이고, 그건 RATED CV NORMAL 이다.

      '
    updated: '2026-08-23'
  required_cv:
    by: 이종수
    text: '운전조건에서 필요한 Cv 다. 문서에 없으면 [Cv 계산] 으로 제안값을 만들 수 있다.

      차압(ΔP)은 기준정보 항목이 아니므로 그 자리에서 사람이 넣는다.

      계산해서 넣은 값은 ''사람 입력'' 으로 기록되고 변환 이력에 계산식이 남는다.

      '
    updated: '2026-08-23'
  valve_body_rating:
    text: '등급에는 반드시 숫자가 있다 — `ANSI CLASS 300` · `600#` · `CL 1500` 이 모두 같은 뜻이다.

      표기가 달라도 숫자가 같으면 같은 값이다.


      ■ 함정

      `End Connection` 칸을 등급으로 오해하기 쉽다. 그 칸에는 `RF FLANGED` 처럼

      연결 형식이 들어 있을 때가 있다(15LV015). 숫자가 없으면 등급이 아니다.

      '
    by: 서경빈
    updated: '2026-08-25'
  valve_body_size:
    text: '`4"` · `4 IN` · `1-1/2in` · `IN DIA. 200 mm` 가 모두 정상 표기다. 단위를 고치지 말고

      문서에 적힌 그대로 둔다.


      ■ 함정

      `Size and Type` 처럼 한 칸에 크기와 모델이 함께 적힌 양식이 있다

      (`1" 1250R-GL`). 이때 크기는 앞부분이고, 뒤는 MODEL NO. 다.

      액추에이터 묶음에도 `Size` 칸이 있다 — 그건 액추에이터 크기이지 밸브 크기가 아니다.

      '
    by: 서경빈
    updated: '2026-08-25'
  type_name:
    text: '문서에 이 항목이 있는 경우는 거의 없다. 태그 접두에서 도출한다 —

      `FV`→Flow · `TV`→Temperature · `PV`→Pressure · `LV`→Level Control Valve.


      ■ 함정

      태그와 실물이 다를 수 있다. `11-FV-039` 는 태그가 FV 인데 내용은

      **댐퍼 액추에이터 정비보고서**였다(2026-08-25). 문서가 무엇인지 먼저 보고,

      태그 규칙과 다르면 문서 쪽을 따르고 비고에 적는다.

      '
    by: 서경빈
    updated: '2026-08-25'
  fluid_state:
    text: '문서에 항목이 없으면 FLUID NAME 에서 유추한다 (`WATER`→LIQUID · `Fuel Gas`→GAS).

      유추한 것이면 비고에 남긴다.


      ■ 함정

      `Fluid` 라는 한 칸에 유체명과 상태가 함께 적힌 양식이 있다 (`LS AR / LIQUID`).

      그때는 뒷부분이 상태다.

      '
    by: 서경빈
    updated: '2026-08-25'
  valve_body_type:
    text: '밸브의 형식이다 — Globe · Butterfly · Ball · Angle 등.


      ■ 함정

      `Body Form` 칸은 형식이 아니다. 주조·단조 구분(`Cast`)이 들어간다.

      19FV077 은 한 줄에 `Size/Pressure Class/Body Form = 2.00 / CL 1500 / Cast` 이고,

      형식(`Globe`)은 다른 줄의 `Valve Model / Body Type` 에 있다 (2026-08-25 확인).

      '
    by: 서경빈
    updated: '2026-08-25'
  valve_leakage_class:
    text: '`CLASS 4` 와 `CLASS IV` 는 같은 값이다. 로마자와 아라비아 숫자를 섞어 쓴다.

      `ANSI Class II` · `FCI 70-2 Class IV` 같은 규격 접두는 붙어 있어도 된다.

      '
    by: 서경빈
    updated: '2026-08-25'
  valve_cage_material:
    text: '벤더마다 케이지를 다르게 부른다 — `Cage` · `Retainer` · `Seat Retainer` ·

      `Cage and/or Bushing`.


      ■ 함정

      **`Guide`(가이드 부싱)는 케이지가 아니다.** 10FV079 는 두 칸이 따로 있고

      값도 다르다(`Guide Material = SOLID STELLITE` vs 케이지 `316 SST`).

      가이드 값을 케이지에 넣지 않는다 (2026-08-25 실측에서 실제로 틀렸던 건).

      '
    by: 서경빈
    updated: '2026-08-25'
  positioner_manufacturer:
    text: '데이터시트에 포지셔너 제조사 항목이 아예 없는 경우가 많다. 모델명으로 유추할 수는

      있지만(`3582G`→Fisher · `DVC6200`→Fisher · `YT-1200`→YTC) **문서에 없는 값을

      만드는 것**이므로 근거를 비고에 남긴다.


      ■ 함정

      `Maker` · `Model No.` 같은 이름은 밸브 본체 칸에도 있다. 그 값이 포지셔너 묶음

      안에 있는지 눈으로 확인한다. 포지셔너가 없는 밸브면 N/A 다.

      '
    by: 서경빈
    updated: '2026-08-25'
  actuator_type:
    text: '`DIAPHRAGM` · `PISTON` · `VL Cylinder` 처럼 구동 방식을 적는다. 문서에 항목이

      없으면 모델명에서 유추할 수 있다 (`A200 SR` 의 SR = Spring Return).

      유추면 비고에 남긴다.

      '
    by: 서경빈
    updated: '2026-08-25'
  normal_flow_rate:
    text: '공정 조건 유량다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.


      ■ 함정

      NOR 열이 비어 있는 문서가 있다. 그때 MAX 값을 대신 쓰지 않는다 — N/A 로 두고

      비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로 둔다

      (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

      '
    by: 서경빈
    updated: '2026-08-25'
  normal_pressure:
    text: '공정 조건 압력다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.


      ■ 함정

      NOR 열이 비어 있는 문서가 있다. 그때 MAX 값을 대신 쓰지 않는다 — N/A 로 두고

      비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로 둔다

      (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

      '
    by: 서경빈
    updated: '2026-08-25'
  normal_temperature:
    text: '공정 조건 온도다. 표는 보통 `MIN / NOR / MAX` 세 열로 되어 있고 **NOR(Normal) 열**을 쓴다.


      ■ 함정

      NOR 열이 비어 있는 문서가 있다. 그때 MAX 값을 대신 쓰지 않는다 — N/A 로 두고

      비고에 "NOR 열 공란" 을 적는다. 단위 표기는 문서에 적힌 그대로 둔다

      (`142.6 m3/Hr` · `205 kg/cm2(g)` 가 모두 정상이다).

