; pytest 설정 — 소유: 이종수 책임
;
; 이 저장소에는 자체 검증 방식이 두 가지 섞여 있다.
;
;   1) pytest      src/<모듈>/test_*.py          (서경빈 선임)
;   2) 단독 스크립트 fixtures/<모듈>/test_*.py    (이종수 책임)
;
; 2번은 import 시점에 바로 돌고 `sys.exit()` 로 끝난다 — 비개발자도 파일 하나만
; 실행하면 결과가 보이게 하려는 것이다. 그런데 이름이 `test_*.py` 여서 pytest 가
; 수집하려 하고, 수집 중 SystemExit 이 나서 **루트에서 `pytest` 가 통째로 깨진다.**
;
; 그래서 pytest 의 수집 범위를 src/ 로 제한한다. fixtures/ 의 스크립트는 그대로
; 직접 실행한다:
;
;   python -m pytest                              모듈 테스트 전부
;   python fixtures/preprocess/test_tag.py        태그 규칙 51건
;   python fixtures/preprocess/test_recency.py    페이지 최신성 30건
;   python -m src.pipeline --smoke                엔드투엔드
;
; 새 모듈 테스트는 `src/<모듈>/test_*.py` 에 두면 자동으로 수집된다.

[pytest]
testpaths = src
norecursedirs = fixtures runs raw_file backup_data readme docs tools .git *__pycache__
addopts = -q
